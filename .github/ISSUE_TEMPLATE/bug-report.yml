name: 🐛 Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        If you believe you have found a way out of the sandbox itself, do not describe it
        here. Read [SECURITY.md](../../SECURITY.md) and report it privately.

  - type: input
    id: bug_title
    attributes:
      label: Title
      description: A short summary of the bug
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this affect?
      options:
        - Resource discovery (pruning)
        - Sandbox application (running a submission)
        - Image build
        - Repository tooling or CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? Also tell us, what did you expect to happen?
      placeholder: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: To reproduce
      description: The exact commands, from a clean checkout. Name the image if you used one.
      placeholder: |
        1. `docker compose -f docker/run_phase/java/docker-compose.yaml up --build`
        2. `core/phobos.sh --config core/config/BaseLanguage-java.cfg -- ./gradlew test`
        3. See the bind failure for `/usr/lib/jvm/...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel and distribution
      description: Output of `uname -a`, plus the distribution. The sandbox depends on kernel features, so this decides most reports.
      placeholder: e.g. Linux 6.8.0-51-generic, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Which language environment?
      placeholder: e.g. Java with Gradle, Python with pytest, C
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Which configuration was in use?
      description: The `.cfg` files passed to `phobos.sh`, or the path set the prune phase produced.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output, including the bind or connect failure if there is one.
      render: shell
