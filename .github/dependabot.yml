version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Renovate owns routine version updates in this repository. Without this line
    # Dependabot opens its own version-update pull requests for the same manifests.
    # A limit of 0 suppresses version updates only; security updates, and the group
    # below, are unaffected by it.
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
