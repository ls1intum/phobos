# Builds the images this repository can build, and tests the ones it ships.
#
# The run-phase images, one per language, are the artefact: each is where the four C products are
# compiled, in a stage of their own, and it is what an exercise actually runs in. They are built
# here so that the acceptance suites run against them on every change rather than by hand.
#
# An image is built and exercised in the SAME job on purpose. Loading an image populates
# the Docker daemon of that runner and no other, so a separate test job would quietly build a
# second image and test that instead. The suites are therefore split into groups that run in
# parallel jobs, and every job builds its own image from the same context (about a minute);
# a group is a matrix entry, so one job names the suites that broke and the wall time of a run
# is that of its longest group, not of all the suites one after the other.
name: Build

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests for phobos-landlock-filesystem-and-networksystem, the connect guard and the network filter
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gcc-14 and nothing else. The syscalls are interposed through the linker, so
      # this needs no Landlock, no container and no elevated permission. The runner's
      # default gcc is not the compiler this suite is pinned to, so gcc-14 is installed
      # rather than assumed.
      - name: Install gcc-14
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-14

      - name: Run the unit tests
        run: bash protecter/test/unit/phobos-landlock-filesystem-and-networksystem/run.sh

      - name: Run the connect guard unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-networksystem/seccomp_networksystem_run.sh

      # The guard installs a real seccomp filter and forks only when run for real; the unit
      # suite wraps every syscall and fork instead, so it needs no kernel, and its interposed
      # calls are answered rather than passed through, so gcov's own writes are undisturbed.
      # Lines are held to 100 %; branches are reported, not gated, for the reason the script
      # states.
      - name: Every line of the connect guard ran
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-networksystem/seccomp_networksystem_run.sh --coverage

      # The denial reporter's sources are held to the same line gate as the guard, and its
      # quoting to bash's own over a corpus of names.
      - name: Run the denial reporter unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-filesystem/seccomp_filesystem_run.sh

      - name: Every line of the denial reporter ran
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-filesystem/seccomp_filesystem_run.sh --coverage

      # No coverage step, deliberately. The suite interposes open and close, which is
      # also how the gcov runtime writes its .gcda files, so an instrumented run has
      # gcov's own diagnostics landing on stderr. That breaks the test asserting that a
      # run which goes through says nothing, and it means the figures come from a
      # perturbed run in the first place.
      # protecter/test/unit/phobos-landlock-filesystem-and-networksystem/mutation.sh is the stronger
      # measure of this suite and runs as the mutation job below.

  images:
    name: Build the ${{ matrix.name }} image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prune orchestrate
            slug: prune-orchestrate
            context: .
            dockerfile: docker/pruner/orchestrate/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker build rather than docker/build-push-action: this organisation allows
      # only actions it owns and actions GitHub publishes, so every third-party one is
      # refused before the run starts. Docker and buildx are on the runner already.
      #
      # The run-phase images are deliberately absent: the jobs below build them and then
      # test those exact images, and building them here as well would prove nothing twice.
      - name: Build
        env:
          # The weekly run is the one that has to notice a moved base image or a changed
          # apt package, and a layer that is simply reused is precisely what would hide
          # that. --no-cache reruns the layers, --pull re-resolves the base image;
          # neither does the other's half.
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
          # Through the environment rather than interpolated into the command. These three
          # values come from the matrix above and are safe, but a run block that pastes
          # an expression into a shell is the shape to avoid having anywhere.
          IMAGE_SLUG: ${{ matrix.slug }}
          BUILD_CONTEXT: ${{ matrix.context }}
          BUILD_DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          # shellcheck disable=SC2086
          docker build ${FRESH} -f "${BUILD_DOCKERFILE}" -t "phobos-${IMAGE_SLUG}:ci" "${BUILD_CONTEXT}"

  # Built and tested once per architecture on a native runner, never under emulation:
  # Landlock and the seccomp user-notification the acceptance suites rest on are absent or
  # unreliable under QEMU, so an emulated arm64 run would test nothing. Each leg builds the
  # image for its own architecture, compiling the four C products from source
  # there, and runs the whole acceptance suite against that exact image, so both
  # architectures are proven before the image is published by hand (see AGENTS.md).
  run-phase:
    name: Build the run-phase image (${{ matrix.platform }}) and hold it to the ${{ matrix.group }} suites
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        group: [acceptance, matrix-a, matrix-b, recorder-and-egress, pruner]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile copies flat names that live in two directories, so the context is
      # put together first. The acceptance README calls this same script, which is what
      # keeps the documented build and this one from drifting apart.
      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      # A plain docker build, so the image lands in this runner's own daemon and the
      # steps below run the image this job just built rather than one they built
      # themselves. Third-party actions are refused in this organisation anyway.
      - name: Build the run-phase image
        id: build
        env:
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
        run: |
          # shellcheck disable=SC2086
          docker build ${FRESH} \
            -f docker/protecter/java/Dockerfile \
            -t phobos-run-phase:ci \
            "${RUNNER_TEMP}/run-phase-context"

      # No --privileged, no --cap-add, no --security-opt, in any of the acceptance steps
      # below. That is the claim these suites exist to make, and CI is where it stops
      # being a claim.
      #
      # --network none for the same reason. Every Maven call in the suites is offline
      # and the checks are meant to hold without a network, so the gate says so instead
      # of trusting that nobody drops an -o later. Loopback survives it, which is what
      # the socket assertions need.
      #
      # Nothing is mounted over /root/.m2 either. The base image ships a populated
      # Maven repository, and a cache volume mounted there hides it: the offline
      # `mvn clean` steps in the phase test then fail for want of a plugin, which looks
      # like a sandbox failure and is not one.
      - name: The five guarantees
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/run-tests.sh

      - name: Inheritance, non-root and the control probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/extra-tests.sh

      # Its own step because it is the one suite that resolves Maven plugins, and a
      # failure here is a dependency problem rather than a Landlock regression. It still
      # fails the job: naming the cause is for diagnosis, not for excusing it.
      - name: Tightening and widening rights across phases
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/phase-test.sh

      # The one suite that runs the shipped policy an exercise actually gets, rather than a
      # tight test policy, so a regression that breaks an ordinary run under it, or widens it,
      # fails here. The image bakes protecter/src/config/BaseLanguage-java-gradle.cfg, so this exercises it.
      - name: The shipped policy runs an exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/shipped-policy-test.sh

      # The Maven reference exercise under the Maven base, once per JAVA_USING_MAVEN_* configuration the
      # image ships: both tests pass, and a file the base does not name, or the dependency repository to a
      # run with no Ares 2 policy, stays refused. The exercise is mounted read-only, as grading copies it.
      - name: The Maven base runs the Maven reference exercise under every Maven configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            -v "${PWD}/exercises/java/maven-reference:/exercise:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/maven-policy-test.sh

      # The Gradle reference exercise under the Java base the image ships, which the layer pruner derived
      # from this very exercise: Artemis's own offline build passes, and a canary, a write beside the
      # working directory and an unnamed address are refused. Without it a stale base would go unnoticed.
      - name: The shipped Java base runs the Gradle reference exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none --memory 6g -v "${PWD}/protecter/test:/tests:ro" \
            -v "${PWD}/exercises/java/gradle-reference:/exercise:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/gradle-policy-test.sh

      # The kernel-enforced network boundary holds against a raw connect() syscall, which is
      # what makes concrete Landlock ports the network boundary alongside the connect guard.
      - name: The network port rule holds against a raw-syscall bypass
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/network-port-test.sh

      # The Landlock bind-port rule keeps a submission off every port but the ones a [bind] rule
      # names, the public port an [accept] rule fronts included, against a raw bind and a
      # kernel-chosen ephemeral port. This is the port containment the inbound filter relies on.
      - name: The Landlock bind-port rule holds against a raw-syscall bind
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/bind-port-test.sh

      # Scoping keeps a submission from signalling the grading process beside it or reaching
      # an abstract UNIX socket outside the sandbox, which the path and port rules do not
      # cover. It confines rather than forbidding, so a process inside the sandbox is still
      # reachable.
      - name: A sandboxed process cannot reach out of the sandbox with a signal
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/scoping-test.sh

      # The ioctl right on a device and the [ioctl] section, with a pseudo-terminal as the device: it works with
      # read, write and ioctl on /dev/pts, stops at the first ioctl without the right, and another device stays
      # refused. The Java image runs it too, as every image can be asked for a terminal.
      - name: The ioctl right on a device is granted by [ioctl] and by nothing else
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/ioctl-device-test.sh

      # The connect guard the image compiled installs its seccomp user-notification filter under
      # the image's default seccomp profile in an ordinary container, and enforces the [connect]
      # allow-list by host and port. This is both the availability check (the filter installs
      # unprivileged here) and the boundary check (both directions), in the image an exercise gets.
      - name: The connect guard enforces the allow-list in the run-phase image
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/seccomp-networksystem-test.sh

      # The network layer's HAProxy processes and its /etc/hosts lines last exactly as long as the
      # run: present while the command runs, gone once it has ended, through phobos.sh and the
      # layer on its own, after a timeout that escalates to SIGKILL, and between concurrent runs.
      # It is the one step that runs HAProxy inside the image, the one an exercise gets.
      - name: The network layer leaves nothing behind in the run-phase image
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/network-cleanup-test.sh

      # The protection matrix: twelve suites that hold the whole of phobos.sh to what it promises, each
      # in a step of its own so one run names every suite that broke. --memory and --pids-limit are
      # cgroup limits, not privileges, so the ordinary-container rule above still holds.

      # The filesystem layer, one right at a time through phobos.sh: every denial has an
      # unprotected control and a run with only that layer off, and the limits the documentation
      # admits are pinned.
      - name: The filesystem layer holds, right by right, and its documented limits stay as documented
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-a' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/filesystem.sh

      # The network layer through phobos.sh: connect by address, port and name, datagrams that
      # must not reach a forbidden receiver, bind and listen closed, the inbound filter, and the
      # egress broker against a decoy.
      - name: The network layer holds for TCP, UDP, bind, listen, accept and host names
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-a' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/network.sh

      # The timeout layer through phobos.sh: the run ends at its limit with the timeout status
      # and no descendant outlives it or escapes the process group.
      - name: The timeout layer ends a run and everything it started
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-a' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/timeout.sh

      # The resource layer through phobos.sh: each limit is read back from the kernel, enforced
      # on a bounded behaviour and inherited. This is the suite that wants the memory and
      # process caps below, which are cgroup limits and not privileges.
      - name: The resource layer sets, enforces and inherits every limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/resources.sh

      # Every subset of switched-off layers with one witness per layer, the flag spellings,
      # concurrent runs and a nested phobos.sh.
      - name: Every combination of the four layers holds exactly where each is on
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/combinations.sh

      # The manual, usage errors, the command line and streams, the override options, the tail
      # flags and policy files that are odd or empty.
      - name: The command line and odd policy files behave as the manual says
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-a' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/cli.sh

      # Nothing is left behind after any way a run can end, the hosts file is restored and its
      # lock is bounded, and what a signal sent to phobos.sh does.
      - name: A run leaves nothing behind, whichever way it ends
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/lifecycle.sh

      # Every shape of a policy line through phobos.sh: what is accepted, what is refused with
      # which status, the spelling of a timeout and every limit read back from the kernel.
      - name: Every shape of a policy line is judged as the parser should
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/policy-syntax.sh

      # The network layer at its edges: where a range ends, the port boundaries, special
      # addresses, IPv6 spellings, non-blocking connects, socket kinds and a destination
      # rewritten during a TCP connect.
      - name: The network layer holds at the edges of ranges, ports and socket kinds
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/network-edge.sh

      # The filesystem layer at its edges: links, dot-dot, magic links, path descriptors, rights
      # on files and the root, odd names and a link swapped while it is opened.
      - name: The filesystem layer holds against links, dot-dot, magic links and swaps
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/filesystem-edge.sh

      # Each limit met through the call that meets it, and the limits Phobos does not set.
      - name: Each resource limit holds through the call that meets it
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/resources-edge.sh

      # Every blocked action is reported once and every result is the one Landlock alone gives,
      # and the group lock's refusals are reported while they stay refused in every state.
      - name: The reporter reports each blocked action and changes no outcome
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'acceptance' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/integration/protection-matrix/reporting.sh

      # The repository's command line on the image this job just built, with a real Docker: the file the
      # policy does not name stays refused and the one a configuration names is readable, the container
      # it starts has the limits and none of the privileges, the status and the signals of the command
      # reach the caller, an Ares 2 policy of the Maven reference exercise passes through the staged
      # copy and the translated project root, and Compose accepts what prune and record build.
      - name: The repository's command line starts an ordinary container and the sandbox holds in it
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'matrix-b' }}
        run: bash protecter/test/integration/phobos_cli_docker.sh phobos-run-phase:ci

      # The prune image is the run-phase image this job just built plus strace, python3 and the
      # protection matrix's probe, with a base that grants nothing. It is built on top of that exact
      # image, so the layer pruner is held to the layers this job has just proven. Built from the
      # repository root, since the probe's source lives under protecter/test/.
      - name: Build the prune image on the run-phase image
        id: prune-build
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success'
          && contains(fromJSON('["recorder-and-egress","pruner"]'), matrix.group) }}
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers:ci .

      # strace observes a Landlock refusal made inside the shipped chain, a permitted read beside it
      # still works, and the parser and attribution turn the record into exactly that one denial. An
      # ordinary container, as for every suite above: ptrace of one's own child needs no privilege.
      - name: The prune image's observer sees what the layers refuse, and only that
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'recorder-and-egress' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/protecter/test:/repo/protecter/test:ro" -v "${PWD}/pruner:/repo/pruner:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" \
            phobos-prune-layers:ci \
            bash /repo/pruner/exercise_pruner/test/integration/infrastructure/layer_prune_observer.sh

      # The recording pruner, in the prune image just built: its refusals (record_safety.sh), a real
      # terminal with Ctrl+C, Ctrl+Z and fg (record_interactive.sh), its replay check in both
      # directions, each phase in a new container (record_replay.sh), and the policy it generates from
      # recorded sessions, merged, replayed, held to the forbidden direction and given derived limits
      # (record_generate.sh); from outside, the run-phase image holds no strace and refuses the
      # recorder. Every container is ordinary.
      - name: The recording pruner records with the terminal passed through and replays under the layers
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'recorder-and-egress' }}
        timeout-minutes: 40
        run: >-
          bash pruner/runtime_pruner/test/integration/interface/record_host.sh
          phobos-prune-layers:ci phobos-run-phase:ci

      # The recording pruner on a host name: a stand-in server on a Docker network with no route out
      # serves TLS and DNS for api.phobos.test; the recorded session's policy names the host from the
      # ClientHello, and the replay under the egress broker passes while the neighbouring port stays
      # refused. Every container is ordinary; the network has no route out.
      - name: The recording pruner writes a host name rule and replays it through the egress broker
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'recorder-and-egress' }}
        timeout-minutes: 15
        run: bash pruner/runtime_pruner/test/integration/interface/record_networked.sh phobos-prune-layers:ci

      # The whole pipeline on the fixture exercise: the derived policy passes the build with every
      # layer on, refuses what the build did not need, bounds each limit, and every wrong-reason
      # variant aborts without a policy. The repository is mounted read-only; the suite copies what
      # it prunes.
      - name: The layer pruner derives a policy that holds in both directions
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'pruner' }}
        timeout-minutes: 50
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}:/repo:ro" phobos-prune-layers:ci \
            bash /repo/pruner/exercise_pruner/test/integration/interface/layer_prune.sh

      # Declared hosts: of two the fixture declares, the one it needs keeps its rule and the other is
      # dropped. A stand-in resolver and a TLS server on loopback stand in for the external host, so
      # this needs no network either.
      - name: The layer pruner keeps exactly the declared hosts a build needs
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'recorder-and-egress' }}
        timeout-minutes: 30
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}:/repo:ro" phobos-prune-layers:ci \
            bash /repo/pruner/exercise_pruner/test/integration/interface/layer_prune_egress.sh

  # The run-phase image for Python, built FROM the official Python image rather than Artemis's
  # ls1tum/artemis-python-docker (see its Dockerfile), on native runners for both architectures as
  # the Java image is. It is held to every suite that does not need Java: the language-neutral
  # acceptance suites and the whole protection matrix, which replace the image's base with their
  # own whatever language it is for. The four acceptance suites that compile Java probes or run
  # Maven (run-tests, extra-tests, phase-test, shipped-policy-test) stay with the Java job. The layer
  # pruner is then built on this image and prunes the fixture on it, so the pruner is proven on the
  # image it prunes Python exercises in.
  run-phase-python:
    name: Build the Python run-phase image (${{ matrix.platform }}) and hold it to the ${{ matrix.group }} suites
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        group: [pruner-a, egress, suites-a, suites-b]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      - name: Build the Python run-phase image
        id: build
        env:
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
        run: |
          # shellcheck disable=SC2086
          docker build ${FRESH} \
            -f docker/protecter/python/Dockerfile \
            -t phobos-run-phase-python:ci \
            "${RUNNER_TEMP}/run-phase-context"

      # The same ordinary containers as the Java job: --network none, and no --privileged, no
      # --cap-add, no --security-opt. The cgroup limits the Java job gives the matrix are given to
      # the acceptance suites here too, which only bounds them. One step per suite would repeat the
      # Java job's seventeen; a loop that names every suite it runs, and fails when any one does,
      # says the same.
      - name: The language-neutral acceptance suites and the first half of the protection matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'suites-a' }}
        run: |
          failed=0
          for suite in \
              landlock-filesystem-and-networksystem-acceptance/network-port-test.sh \
              landlock-filesystem-and-networksystem-acceptance/bind-port-test.sh \
              landlock-filesystem-and-networksystem-acceptance/scoping-test.sh \
              landlock-filesystem-and-networksystem-acceptance/ioctl-device-test.sh \
              landlock-filesystem-and-networksystem-acceptance/process-groups-test.sh \
              landlock-filesystem-and-networksystem-acceptance/seccomp-networksystem-test.sh \
              landlock-filesystem-and-networksystem-acceptance/network-cleanup-test.sh \
              protection-matrix/network.sh \
              protection-matrix/timeout.sh \
              protection-matrix/filesystem.sh \
              protection-matrix/cli.sh; do
            echo "::group::${suite}"
            if ! docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
                phobos-run-phase-python:ci bash "/tests/integration/${suite}"; then
              failed=1
              echo "::error::${suite} failed"
            fi
            echo "::endgroup::"
          done
          exit "${failed}"

      - name: The language-neutral acceptance suites and the second half of the protection matrix
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'suites-b' }}
        run: |
          failed=0
          for suite in \
              protection-matrix/network-edge.sh \
              protection-matrix/combinations.sh \
              protection-matrix/lifecycle.sh \
              protection-matrix/policy-syntax.sh \
              protection-matrix/filesystem-edge.sh \
              protection-matrix/resources.sh \
              protection-matrix/resources-edge.sh; do
            echo "::group::${suite}"
            if ! docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
                phobos-run-phase-python:ci bash "/tests/integration/${suite}"; then
              failed=1
              echo "::error::${suite} failed"
            fi
            echo "::endgroup::"
          done
          exit "${failed}"

      - name: The reporter reports each blocked action on the Python image and changes no outcome
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'egress' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase-python:ci bash /tests/integration/protection-matrix/reporting.sh

      # The Python reference exercise under the Python base the image ships, which the layer pruner
      # derived from this very exercise: the template's two phases pass, and a canary, a write beside
      # the working directory and an unnamed address are refused. Without it a stale base would go
      # unnoticed, as the previous one did.
      - name: The shipped Python base runs the Python reference exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.group == 'suites-a' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            -v "${PWD}/exercises/python/python-reference:/exercise:ro" \
            phobos-run-phase-python:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/python-policy-test.sh

      - name: Build the prune image on the Python run-phase image
        id: prune-build
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success'
          && contains(fromJSON('["pruner-a","egress"]'), matrix.group) }}
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase-python:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers-python:ci .

      - name: The prune image's observer on the Python image sees what the layers refuse, and only that
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'pruner-a' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/protecter/test:/repo/protecter/test:ro" -v "${PWD}/pruner:/repo/pruner:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" \
            phobos-prune-layers-python:ci \
            bash /repo/pruner/exercise_pruner/test/integration/infrastructure/layer_prune_observer.sh

      - name: The layer pruner on the Python image derives a policy that holds in both directions
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'pruner-a' }}
        timeout-minutes: 50
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}:/repo:ro" phobos-prune-layers-python:ci \
            bash /repo/pruner/exercise_pruner/test/integration/interface/layer_prune.sh

      - name: The layer pruner on the Python image keeps exactly the declared hosts a build needs
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'egress' }}
        timeout-minutes: 30
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}:/repo:ro" phobos-prune-layers-python:ci \
            bash /repo/pruner/exercise_pruner/test/integration/interface/layer_prune_egress.sh

      # The Python reference exercise, pruned as Compose's prune_python prunes it: pytest under the
      # layers, and every stage ending in a policy rather than an abort.
      - name: The layer pruner prunes the Python reference exercise on the Python image
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' && matrix.group == 'pruner-a' }}
        timeout-minutes: 30
        run: |
          output="$(mktemp -d)"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" -v "${output}:/var/tmp/path_sets" \
            --entrypoint python3 phobos-prune-layers-python:ci \
            /var/tmp/helpers/exercise_pruner/src/interface/main.py python
          test -s "${output}/python_python-reference.cfg"

  # The run-phase image for C exercises built with Artemis's FACT template, on native runners for both
  # architectures. The shipped C base is derived from the FACT reference exercise on this very image, so the
  # job holds the image to that exercise in both directions and proves the layer pruner still prunes it:
  # the exercise's declared `runs_compiled_programs` setting is the one place a base keeps execute beside write.
  run-phase-c-fact:
    name: Build the C (FACT) run-phase image (${{ matrix.platform }}) and hold it to the FACT reference exercise
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      - name: Build the C (FACT) run-phase image
        id: build
        env:
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
        run: |
          # FRESH is either empty or two flags, so it must be split into words.
          # shellcheck disable=SC2086
          docker build ${FRESH} \
            -f docker/protecter/c-fact/Dockerfile \
            -t phobos-run-phase-c-fact:ci \
            "${RUNNER_TEMP}/run-phase-context"

      - name: The shipped C base runs the FACT reference exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            -v "${PWD}/exercises/c/fact-reference:/exercise:ro" \
            phobos-run-phase-c-fact:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/c-fact-policy-test.sh

      - name: The reporter reports each blocked action on the C image and changes no outcome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase-c-fact:ci bash /tests/integration/protection-matrix/reporting.sh

      - name: Build the prune image on the C (FACT) run-phase image
        id: prune-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase-c-fact:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers-c-fact:ci .

      - name: The layer pruner prunes the FACT reference exercise on the C image
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          output="$(mktemp -d)"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" -v "${output}:/var/tmp/path_sets" \
            --entrypoint python3 phobos-prune-layers-c-fact:ci \
            /var/tmp/helpers/exercise_pruner/src/interface/main.py c-fact
          test -n "$(find "${output}" -maxdepth 1 -name '*fact-reference.cfg' -size +0)"

  # The run-phase image for R exercises built with Artemis's R template, on native runners for both
  # architectures. The shipped R base is derived from the R reference exercise on this very image, so the
