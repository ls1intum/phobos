      - name: The reporter reports each blocked action on the R image and changes no outcome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase-r:ci bash /tests/integration/protection-matrix/reporting.sh

      - name: Build the prune image on the R run-phase image
        id: prune-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase-r:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers-r:ci .

      - name: The layer pruner prunes the R reference exercise on the R image
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' }}
