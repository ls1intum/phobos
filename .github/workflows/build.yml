# Builds the images this repository can build, and tests the one it ships.
#
# The run-phase image is the artefact: it is where both C products are compiled, in a
# stage of their own, and it is what an exercise actually runs in. It is built here so
# that the acceptance suites run against it on every change rather than by hand.
#
# The image is built and exercised in ONE job on purpose. Loading an image populates
# the Docker daemon of that runner and no other, so a separate acceptance job would
# quietly build a second image and test that instead.
name: Build

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests for phobos-landlock-filesystem-and-networksystem, the connect guard and the network filter
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # gcc-14 and nothing else. The syscalls are interposed through the linker, so
      # this needs no Landlock, no container and no elevated permission. The runner's
      # default gcc is not the compiler this suite is pinned to, so gcc-14 is installed
      # rather than assumed.
      - name: Install gcc-14
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-14

      - name: Run the unit tests
        run: bash tests/unit/run.sh

      - name: Run the connect guard unit tests
        if: ${{ !cancelled() }}
        run: bash tests/unit/seccomp_networksystem_run.sh

      # The guard installs a real seccomp filter and forks only when run for real; the unit
      # suite wraps every syscall and fork instead, so it needs no kernel, and its interposed
      # calls are answered rather than passed through, so gcov's own writes are undisturbed.
      # Lines are held to 100 %; branches are reported, not gated, for the reason the script
      # states.
      - name: Every line of the connect guard ran
        if: ${{ !cancelled() }}
        run: bash tests/unit/seccomp_networksystem_run.sh --coverage

      # No coverage step, deliberately. The suite interposes open and close, which is
      # also how the gcov runtime writes its .gcda files, so an instrumented run has
      # gcov's own diagnostics landing on stderr. That breaks the test asserting that a
      # run which goes through says nothing, and it means the figures come from a
      # perturbed run in the first place. tests/unit/mutation.sh is the stronger measure
      # of this suite and already runs weekly below.

  images:
    name: Build the ${{ matrix.name }} image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prune java
            slug: prune-java
            context: docker/prune_phase/java
          - name: prune python
            slug: prune-python
            context: docker/prune_phase/python
          - name: prune orchestrate
            slug: prune-orchestrate
            context: docker/prune_phase/orchestrate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker build rather than docker/build-push-action: this organisation allows
      # only actions it owns and actions GitHub publishes, so every third-party one is
      # refused before the run starts. Docker and buildx are on the runner already.
      #
      # The run-phase image is deliberately absent: the job below builds it and then
      # tests that exact image, and building it here as well would prove nothing twice.
      - name: Build
        env:
          # The weekly run is the one that has to notice a moved base image or a changed
          # apt package, and a layer that is simply reused is precisely what would hide
          # that. --no-cache reruns the layers, --pull re-resolves the base image;
          # neither does the other's half.
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
          # Through the environment rather than interpolated into the command. These two
          # values come from the matrix above and are safe, but a run block that pastes
          # an expression into a shell is the shape to avoid having anywhere.
          IMAGE_SLUG: ${{ matrix.slug }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: |
          # shellcheck disable=SC2086
          docker build ${FRESH} -t "phobos-${IMAGE_SLUG}:ci" "${BUILD_CONTEXT}"

  # Built and tested once per architecture on a native runner, never under emulation:
  # Landlock and the seccomp user-notification the acceptance suites rest on are absent or
  # unreliable under QEMU, so an emulated arm64 run would test nothing. Each leg builds the
  # image for its own architecture, compiling the library and both C products from source
  # there, and runs the whole acceptance suite against that exact image, so both
  # architectures are proven before the image is published by hand (see AGENTS.md).
  run-phase:
    name: Build the run-phase image (${{ matrix.platform }}) and hold it to the acceptance suites
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile copies flat names that live in two directories, so the context is
      # put together first. The acceptance README calls this same script, which is what
      # keeps the documented build and this one from drifting apart.
      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      # A plain docker build, so the image lands in this runner's own daemon and the
      # steps below run the image this job just built rather than one they built
      # themselves. Third-party actions are refused in this organisation anyway.
      - name: Build the run-phase image
        id: build
        env:
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
        run: |
          # shellcheck disable=SC2086
          docker build ${FRESH} \
            -f docker/run_phase/java/Dockerfile \
            -t phobos-run-phase:ci \
            "${RUNNER_TEMP}/run-phase-context"

      # No --privileged, no --cap-add, no --security-opt, in any of the acceptance steps
      # below. That is the claim these suites exist to make, and CI is where it stops
      # being a claim.
      #
      # --network none for the same reason. Every Maven call in the suites is offline
      # and the checks are meant to hold without a network, so the gate says so instead
      # of trusting that nobody drops an -o later. Loopback survives it, which is what
      # the socket assertions need.
      #
      # Nothing is mounted over /root/.m2 either. The base image ships a populated
      # Maven repository, and a cache volume mounted there hides it: the offline
      # `mvn clean` steps in the phase test then fail for want of a plugin, which looks
      # like a sandbox failure and is not one.
      - name: The five guarantees
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/run-tests.sh

      - name: Inheritance, non-root and the control probe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/extra-tests.sh

      # Its own step because it is the one suite that resolves Maven plugins, and a
      # failure here is a dependency problem rather than a Landlock regression. It still
      # fails the job: naming the cause is for diagnosis, not for excusing it.
      - name: Tightening and widening rights across phases
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/phase-test.sh

      # The one suite that runs the shipped policy an exercise actually gets, rather than a
      # tight test policy, so a regression that breaks an ordinary run under it, or widens it,
      # fails here. The image bakes core/config/BaseLanguage-java.cfg, so this exercises it.
      - name: The shipped policy runs an exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/shipped-policy-test.sh

      # The kernel-enforced network boundary holds against a raw connect() syscall, which is
      # what makes concrete Landlock ports the network boundary alongside the connect guard.
      - name: The network port rule holds against a raw-syscall bypass
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/network-port-test.sh

      # The Landlock bind-port rule keeps a submission off every port but the ones a [bind] rule
      # names, the public port an [accept] rule fronts included, against a raw bind and a
      # kernel-chosen ephemeral port. This is the port containment the inbound filter relies on.
      - name: The Landlock bind-port rule holds against a raw-syscall bind
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/bind-port-test.sh

      # Scoping keeps a submission from signalling the grading process beside it or reaching
      # an abstract UNIX socket outside the sandbox, which the path and port rules do not
      # cover. It confines rather than forbidding, so a process inside the sandbox is still
      # reachable.
      - name: A sandboxed process cannot reach out of the sandbox with a signal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci bash /tests/landlock-filesystem-and-networksystem-acceptance/scoping-test.sh

      # The connect guard the image compiled installs its seccomp user-notification filter under
      # the image's default seccomp profile in an ordinary container, and enforces the [connect]
      # allow-list by host and port. This is both the availability check (the filter installs
      # unprivileged here) and the boundary check (both directions), in the image an exercise gets.
      - name: The connect guard enforces the allow-list in the run-phase image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/tests:/tests:ro" \
            phobos-run-phase:ci \
            bash /tests/landlock-filesystem-and-networksystem-acceptance/seccomp-networksystem-test.sh

  # Mutation testing installs clang and mull into a container and then runs the suite
  # once per mutant, which is minutes rather than seconds. Weekly and on request, so it
  # reports on the suite's strength without being in the way of a pull request.
  mutation:
    name: Mutation score of the wrapper suite
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run mutation testing
        run: bash tests/unit/mutation.sh
