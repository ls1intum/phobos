        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase-cpp:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers-cpp:ci .

      - name: The layer pruner prunes the C++ reference exercise on the C++ image
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          output="$(mktemp -d)"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" -v "${output}:/var/tmp/path_sets" \
            --entrypoint python3 phobos-prune-layers-cpp:ci \
            /var/tmp/helpers/exercise_pruner/src/interface/main.py cpp
          test -n "$(find "${output}" -maxdepth 1 -name '*cpp-reference.cfg' -size +0)"

  # Mutation testing installs clang and mull into a container and then runs the suite
  # once per mutant. It runs on every change like the other jobs, and a run that does
  # not reach a score fails it, so a toolchain that stops compiling the sources is
  # noticed in the pull request that broke it and not a week later.
  mutation:
    name: Mutation score of the wrapper suite
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run mutation testing
        run: bash protecter/test/unit/phobos-landlock-filesystem-and-networksystem/mutation.sh
