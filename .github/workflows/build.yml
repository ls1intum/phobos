  run-phase-r:
    name: Build the R run-phase image (${{ matrix.platform }}) and hold it to the R reference exercise
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
