      - name: The shipped GCC base runs the GCC reference exercise both ways
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none -v "${PWD}/protecter/test:/tests:ro" \
            -v "${PWD}/exercises/c/gcc-reference:/exercise:ro" \
            phobos-run-phase-c-gcc:ci \
            bash /tests/integration/landlock-filesystem-and-networksystem-acceptance/c-gcc-policy-test.sh

      - name: The reporter reports each blocked action on the GCC image and changes no outcome
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm --network none --memory 3g --pids-limit 1024 -v "${PWD}/protecter/test:/tests:ro" \
            phobos-run-phase-c-gcc:ci bash /tests/integration/protection-matrix/reporting.sh

      - name: Build the prune image on the GCC run-phase image
        id: prune-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase-c-gcc:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers-c-gcc:ci .

      - name: The layer pruner prunes the GCC reference exercise on the GCC image
        if: ${{ !cancelled() && steps.prune-build.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          output="$(mktemp -d)"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" -v "${output}:/var/tmp/path_sets" \
            --entrypoint python3 phobos-prune-layers-c-gcc:ci \
            /var/tmp/helpers/exercise_pruner/src/interface/main.py c-gcc
          test -n "$(find "${output}" -maxdepth 1 -name '*gcc-reference.cfg' -size +0)"

  # The run-phase image for C++ exercises built with Artemis's C++ template, on native runners for both
  # architectures. The shipped C++ base is derived from the C++ reference exercise on this very image, so the
