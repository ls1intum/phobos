        run: |
          output="$(mktemp -d)"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${PWD}/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${PWD}/pruner:/var/tmp/helpers:ro" -v "${output}:/var/tmp/path_sets" \
            --entrypoint python3 phobos-prune-layers-r:ci \
            /var/tmp/helpers/exercise_pruner/src/interface/main.py r
          test -n "$(find "${output}" -maxdepth 1 -name '*r-reference.cfg' -size +0)"

  # The run-phase image for C exercises built with Artemis's GCC template, on native runners for both
  # architectures. The shipped GCC base is derived from the GCC reference exercise on this very image, so the
  # job holds the image to that exercise in both directions and proves the layer pruner still prunes it.
  run-phase-c-gcc:
    name: Build the GCC run-phase image (${{ matrix.platform }}) and hold it to the GCC reference exercise
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      - name: Build the GCC run-phase image
        id: build
        env:
          FRESH: ${{ github.event_name == 'schedule' && '--pull --no-cache' || '' }}
        run: |
          # FRESH is either empty or two flags, so it must be split into words.
          # shellcheck disable=SC2086
          docker build ${FRESH} \
            -f docker/protecter/c-gcc/Dockerfile \
            -t phobos-run-phase-c-gcc:ci \
