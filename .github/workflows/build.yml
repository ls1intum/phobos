  run-phase-cpp:
    name: Build the C++ run-phase image (${{ matrix.platform }}) and hold it to the C++ reference exercise
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the build context
        run: .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"

      - name: Build the C++ run-phase image
