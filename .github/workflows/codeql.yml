name: CodeQL

on:
  pull_request:
    # fix/prune-and-helper-defects is here because this change is stacked on that
    # branch, and a base-branch filter is matched against the pull request's base.
    # Without the entry this workflow does not run on that pull request at all.
    # Remove it once that branch has landed.
    branches: [ "main", "fix/prune-and-helper-defects" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    # A pull request from a fork cannot write security events, so the job would fail
    # rather than report. Runs on push to main still cover such a contribution once merged.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ "c-cpp", "python" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode none, for both languages on purpose. The only compiled component is the
      # netblocker preload library, which has no build system in this repository: the
      # committed libnetblocker.so is produced by hand and the images copy it in. There is
      # therefore no build for CodeQL to watch, and autobuild would have nothing to find.
      # build-mode none analyses the C sources without compiling them.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
