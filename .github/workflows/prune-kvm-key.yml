# One key of the KVM run of the layer pruner, called by prune-kvm.yml once per key and source; prune-kvm.yml says
# what the run is for. Three jobs, which hand over artefacts and never share a directory:
#   prune  the default prune in an ordinary container on an x86 runner: the .cfg and .json of every exercise;
#   kvm    the audit observer in the guest, on ubuntu-24.04 and ubuntu-26.04: the .abi10.json and .abi10.cfg;
#   merge  the orchestrator over both sets in one directory: BaseLanguage-<key>.cfg with the rows folded in.
# Every call of one run shares one artefact namespace, so each artefact name ends in -<key>-<source>. The guest
# kernel comes from prune-kvm.yml's kernel job, built or restored once per runner image for the whole run.
name: Prune one key with the kernel as a second observer

on:
  workflow_call:
    inputs:
      key:
        description: "The key to prune and verify"
        required: true
        type: string
      source:
        description: "fixture or reference, as stage-prune-inputs.sh takes it"
        required: true
        type: string

permissions: {}

env:
  PRUNE_KEY: ${{ inputs.key }}
  PRUNE_SOURCE: ${{ inputs.source }}
  # The suffix of every artefact this call keeps, unique among the calls of one run.
  SUFFIX: ${{ inputs.key }}-${{ inputs.source }}
  # The run-phase image follows the key: python, c-fact, r, swift, c-gcc and cpp have their own, every other key is a
  # Java one. Folded to stay inside the line length yamllint enforces.
  RUN_PHASE: >-
    ${{ contains(fromJSON('["python","c-fact","r","swift","c-gcc","cpp"]'), inputs.key) && inputs.key || 'java' }}
  # The BuildKit image the run-phase image is built with, as in build.yml, whose layer cache this run shares.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  prune:
    name: The default prune, in an ordinary container
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the build context and stage the inputs
        run: |
          .github/scripts/assemble-run-phase-context.sh "${RUNNER_TEMP}/run-phase-context"
          .github/scripts/stage-prune-inputs.sh "${PRUNE_SOURCE}" "${PRUNE_KEY}" "${RUNNER_TEMP}/inputs"

      - name: Build the run-phase image
        uses: ./.github/actions/build-run-phase-image
        with:
          name: ${{ env.RUN_PHASE }}
          dockerfile: docker/protecter/${{ env.RUN_PHASE }}/Dockerfile
          tag: phobos-run-phase:ci
          context: ${{ runner.temp }}/run-phase-context
          fresh: "false"
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}

      - name: Build the prune image on the run-phase image
        run: |
          docker build --build-arg RUN_PHASE_IMAGE=phobos-run-phase:ci \
            -f docker/pruner/layers/Dockerfile -t phobos-prune-layers:ci .

      # As Compose starts it: no network, cgroup limits, and no privilege, capability or security option.
      - name: Prune the key
        run: |
          mkdir -p "${RUNNER_TEMP}/path_sets"
          docker run --rm --network none --memory 3g --pids-limit 1024 \
            -v "${RUNNER_TEMP}/inputs/exercises:/srv/phobos-prune-exercises:ro" \
            -v "${RUNNER_TEMP}/inputs/helpers:/var/tmp/helpers:ro" \
            -v "${RUNNER_TEMP}/inputs/setup.sh:/setup.sh:ro" -v "${RUNNER_TEMP}/inputs/env.sh:/env.sh:ro" \
            -v "${RUNNER_TEMP}/path_sets:/var/tmp/path_sets" \
            --entrypoint bash phobos-prune-layers:ci -c 'source /env.sh && source /setup.sh \
              && exec python3 /var/tmp/helpers/exercise_pruner/src/interface/main.py --stage all "$0"' "${PRUNE_KEY}"

      # The guest runs this very image, not one built again from the same Dockerfiles: the packages the
      # prune image installs are not pinned, so a second build could hold other versions.
      - name: Save the prune image for the guests
        run: docker save phobos-prune-layers:ci | gzip -1 > "${RUNNER_TEMP}/prune-image.tar.gz"

      - name: Keep the prune image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prune-image-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/prune-image.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Keep the artefacts of the default prune
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: default-prune-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/path_sets
          if-no-files-found: error

  kvm:
    name: The audit observer in a guest on ${{ matrix.runner }}
    needs: prune
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU and the filesystem tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 e2fsprogs

      # First, because a guest that cannot boot under KVM answers nothing.
      - name: Assert that a guest boots under KVM
        run: bash pruner/shared/test/integration/infrastructure/runner-capability-probe.sh --assert-kvm

      - name: Download the guest kernel of this runner image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kvm-kernel-${{ matrix.runner }}
          path: ${{ runner.temp }}/kernel

      # The kernel job checked it already; checked again here, after the hand-over, before the guest boots it.
      - name: Check the guest kernel
        run: .github/scripts/build-kvm-kernel.sh --check "${RUNNER_TEMP}/kernel"

      - name: Stage the inputs
        run: .github/scripts/stage-prune-inputs.sh "${PRUNE_SOURCE}" "${PRUNE_KEY}" "${RUNNER_TEMP}/inputs"

      - name: Download the prune image the default prune ran in
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prune-image-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/image

      - name: Load it
        run: gunzip -c "${RUNNER_TEMP}/image/prune-image.tar.gz" | docker load

      - name: Download the artefacts of the default prune
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: default-prune-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/path_sets

      # The guest proves it can observe Landlock before it prunes anything: version 10 or later, and one
      # deliberate refusal that produces exactly one record it can read back.
      - name: Run the audit observer in the guest
        run: |
          .github/scripts/run-prune-in-kvm-guest.sh phobos-prune-layers:ci "${RUNNER_TEMP}/kernel/bzImage" \
            "${RUNNER_TEMP}/inputs" "${RUNNER_TEMP}/path_sets" "${PRUNE_KEY}"

      - name: Hold the fixture's result to both directions
        if: ${{ env.PRUNE_SOURCE == 'fixture' }}
        run: bash pruner/exercise_pruner/test/integration/application/kvm_fixture_result.sh "${RUNNER_TEMP}/path_sets"

      # Kept even when the run failed, since the records and the console are what explain it.
      - name: Keep the artefacts of the guest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-${{ matrix.runner }}-${{ env.SUFFIX }}
          path: |
            ${{ runner.temp }}/path_sets/*.abi10.*
            ${{ runner.temp }}/path_sets/kvm-console.log
            ${{ runner.temp }}/path_sets/audit-raw.log
          if-no-files-found: warn

  merge:
    name: The base with the ABI 10 rows folded in
    needs: kvm
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # By exact name, each into the directory the steps below read: the run holds the artefacts of every
      # other key too, and the large prune image besides.
      - name: Download the default prune
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: default-prune-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/artefacts/default-prune

      - name: Download the records of the guest on ubuntu-24.04
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kvm-ubuntu-24.04-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/artefacts/kvm-ubuntu-24.04

      - name: Download the records of the guest on ubuntu-26.04
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kvm-ubuntu-26.04-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/artefacts/kvm-ubuntu-26.04

      # The two guests run the same pinned kernel on the same image, so they must find the same rows; a
      # difference fails the job rather than letting either leg stand for both. The comment header of a
      # sidecar holds a date, so the rows are compared without comments.
      - name: Compare the two guests
        run: |
          left="${RUNNER_TEMP}/artefacts/kvm-ubuntu-24.04"
          right="${RUNNER_TEMP}/artefacts/kvm-ubuntu-26.04"
          diff <(cd "${left}" && ls ./*.abi10.cfg 2> /dev/null) <(cd "${right}" && ls ./*.abi10.cfg 2> /dev/null)
          for sidecar in "${left}"/*.abi10.cfg; do
            [ -e "${sidecar}" ] || continue
            diff <(grep -v '^#' "${sidecar}") <(grep -v '^#' "${right}/$(basename "${sidecar}")")
          done

      # One directory, as the orchestrator reads it; the records of the guest on ubuntu-26.04 stand for both.
      - name: Put both sets in one directory and merge
        run: |
          mkdir -p "${RUNNER_TEMP}/path_sets"
          cp -R "${RUNNER_TEMP}/artefacts/default-prune/." "${RUNNER_TEMP}/path_sets/"
          cp "${RUNNER_TEMP}"/artefacts/kvm-ubuntu-26.04/*.abi10.* "${RUNNER_TEMP}/path_sets/"
          python3 pruner/exercise_pruner/src/interface/orchestrate.py --langs "${PRUNE_KEY}" \
            --path-dir "${RUNNER_TEMP}/path_sets" --core-dir "${RUNNER_TEMP}/core" --helpers-dir pruner

      - name: Keep the merged base
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-base-${{ env.SUFFIX }}
          path: ${{ runner.temp }}/core
          if-no-files-found: error
