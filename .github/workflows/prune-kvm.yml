# The KVM run of the layer pruner: a second, kernel-native observer, on x86 only (prune plan A.6.9).
#
# The ordinary-container prune (build.yml, Compose) stays the default and the only thing that writes an
# exercise's configuration. This workflow takes what it wrote and runs the same layers, in the same root
# file system, on a Linux 7.2 kernel in a QEMU guest under KVM, where the pruner owns the kernel and can
# read Landlock's own audit records. Two things come out of it:
#   * a cross-check: every Landlock refusal strace attributed has an audit record that agrees, or the
#     derivation of a right from a call (A.6.2) is wrong for that call and the job fails with both records;
#   * the rights the container kernels (Landlock version 8 and below) never refuse, in particular the UDP
#     bind of version 10: a refused UDP bind the kernel names becomes `<key>_<exercise>.abi10.cfg`, one
#     `[bind] allow <port> udp` row, with a record naming the SHA-256 of the .cfg it verified.
#
# One run is one key and source on one commit, or with the key `all` the fixture and the reference exercises
# of every key, side by side. Each of them is a call of prune-kvm-key.yml, whose three jobs (the default
# prune, the guest on two runner images, the merge) keep artefacts named after the key and source, for example
# merged-base-java-gradle-reference. A base meant to carry ABI 10 rows is adopted from that merge job's
# output, and the adopting pull request links this run. A guest that cannot boot under KVM, or cannot read
# the records, ends its job red as indeterminate (status 3), never as a pass.
#
# The guest kernel is built once per runner image for the whole run, by the kernel job, and kept between runs
# in actions/cache under the runner image's version and the hash of build-kvm-kernel.sh; a restored kernel is
# held to the checks a fresh one is (build-kvm-kernel.sh --check) before any guest boots it.
#
# Manual on purpose: the guest runs the whole of a prune's verification, so it takes far longer than a
# check belonging to every change. `source: fixture` runs the layer pruner's fixture exercise, which binds
# a UDP port, and holds the result to both directions
# (pruner/exercise_pruner/test/integration/application/kvm_fixture_result.sh).
name: Prune with the kernel as a second observer

on:
  workflow_dispatch:
    inputs:
      key:
        description: "The key to prune: java-gradle, java-maven, python, c-fact, r, swift, c-gcc, cpp, or all"
        required: true
        default: java-gradle
        type: string
      source:
        description: "fixture: the layer pruner's fixture; reference: the exercises of the key. all ignores it"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - reference

permissions: {}

concurrency:
  group: prune-kvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: The keys and sources of this run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      combinations: ${{ steps.plan.outputs.combinations }}
    steps:
      # all is the fixture, which runs under java-gradle, and the reference exercises of every key. Any other
      # value is one key, which stage-prune-inputs.sh then refuses unless it knows it.
      - name: List them
        id: plan
        env:
          KEY: ${{ inputs.key }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ "${KEY}" = "all" ]; then
            combinations='[{"key":"java-gradle","source":"fixture"}'
            for key in java-gradle java-maven python c-fact r swift c-gcc cpp; do
              combinations="${combinations},{\"key\":\"${key}\",\"source\":\"reference\"}"
            done
            combinations="${combinations}]"
          elif printf '%s' "${KEY}" | grep -Eqx '[a-z0-9]+(-[a-z0-9]+)*'; then
            combinations="[{\"key\":\"${KEY}\",\"source\":\"${SOURCE}\"}]"
          else
            printf '::error::the key %s is not of the form a key has\n' "${KEY}"
            exit 2
          fi
          printf 'combinations=%s\n' "${combinations}" | tee -a "${GITHUB_OUTPUT}"

  kernel:
    name: The guest kernel for ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image fixes the compiler the kernel is built with, so its name and version are part of the
      # cache key, beside the runner, its architecture and the script that pins the kernel. ImageOS and
      # ImageVersion are variables of the runner's shell, not of the env context, hence this step.
      - name: Name the kernel this runner image needs
        id: image
        env:
          RUNNER_NAME: ${{ matrix.runner }}
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            printf '::error::ImageOS or ImageVersion is not set\n'
            exit 1
          fi
          script="$(sha256sum .github/scripts/build-kvm-kernel.sh | cut -d ' ' -f 1)"
          printf 'key=kvm-kernel-v1-%s-%s-%s-%s-%s\n' "${RUNNER_NAME}" "${RUNNER_ARCH}" "${ImageOS}" "${ImageVersion}" \
            "${script}" | tee -a "${GITHUB_OUTPUT}"

      - name: Restore the kernel of this runner image
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kernel
          key: ${{ steps.image.outputs.key }}

      - name: Install what the kernel build needs
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends build-essential flex bison bc libelf-dev libssl-dev \
            xz-utils curl

      - name: Build the pinned Linux 7.2 guest kernel
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        run: .github/scripts/build-kvm-kernel.sh "${RUNNER_TEMP}/kernel"

      # A restored kernel is held to what the build holds a fresh one to: the files build.txt names, unaltered,
      # and the configuration checks. That finds an accident, not a cache entry written on purpose, which is why
      # only this workflow, run by hand, writes the cache.
      - name: Check the kernel
        run: .github/scripts/build-kvm-kernel.sh --check "${RUNNER_TEMP}/kernel"

      - name: Keep the kernel for later runs
        if: ${{ steps.restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kernel
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: Hand the kernel to the guests of this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-kernel-${{ matrix.runner }}
          path: ${{ runner.temp }}/kernel
          retention-days: 1
          if-no-files-found: error

  key:
    name: ${{ matrix.key }} (${{ matrix.source }})
    needs: [plan, kernel]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.combinations) }}
    uses: ./.github/workflows/prune-kvm-key.yml
    with:
      key: ${{ matrix.key }}
      source: ${{ matrix.source }}
