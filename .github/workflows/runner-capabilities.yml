# Reports what the runner can actually do.
#
# Two things the other workflows do depend on the machine rather than on this repository:
# build.yml runs the Landlock acceptance suites inside an ordinary container, and the layer
# pruner's observer traces a run with ptrace in one. A runner image can withdraw either without
# notice, so when one of those jobs starts failing, this is where the question is asked, in
# one place and the same way every time.
#
# The second job asks whether a runner can boot a virtual machine of its own under KVM, on
# each hosted runner image. Landlock lives in the kernel, so a container always meets the
# runner's kernel, and trying a newer kernel than the runner has needs a virtual machine.
#
# Both jobs also ask whether ptrace, without privileges, sees a traced process's Landlock
# refusal inside an ordinary container, which the layer pruner's observer relies on.
#
# Manual on purpose. It is a diagnostic, not a gate: the assert steps are allowed to fail
# and the verdict is written to the run summary, so one dispatch answers every question
# without turning a red check into the answer.
name: Runner Capabilities

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: runner-capabilities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capabilities:
    name: Probe the runner
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Survey
        run: bash tests/runner-capability-probe.sh --report

      # A capability this repository does not yet use being absent is a fact to record, not
      # a broken run, so "no" is a green dispatch. A probe that could not reach a verdict
      # is not a fact about anything, so it is carried to the last step, which fails.
      - name: Assert that Landlock enforces
        id: landlock
        run: ./.github/scripts/record-capability.sh landlock --assert-landlock

      - name: Assert that ptrace observes a Landlock denial
        id: ptrace
        if: ${{ !cancelled() }}
        run: ./.github/scripts/record-capability.sh ptrace --assert-ptrace

      - name: Write the verdict
        if: ${{ !cancelled() }}
        env:
          LANDLOCK_VERDICT: ${{ steps.landlock.outputs.verdict }}
          PTRACE_VERDICT: ${{ steps.ptrace.outputs.verdict }}
        run: |
          landlock="${LANDLOCK_VERDICT:-indeterminate}"
          ptrace="${PTRACE_VERDICT:-indeterminate}"
          {
            echo "## Runner capabilities"
            echo
            echo "| Capability | Verdict | What depends on it |"
            echo "| --- | --- | --- |"
            echo "| Landlock enforces, host and plain container | ${landlock} | the acceptance suites |"
            echo "| ptrace observes a Landlock denial, plain container | ${ptrace} | the layer pruner's observer |"
            echo
            echo "Read the survey step for the kernel, the Landlock ABI and ptrace_scope behind these answers."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${landlock}" = "indeterminate" ] || [ "${ptrace}" = "indeterminate" ]; then
            echo "::error::A probe could not reach a verdict, so this run answers nothing."
            exit 1
          fi

  # Whether QEMU can use KVM on each hosted runner. The runner's own kernel is the guest, which
  # proves that a guest boots and how fast, not which Landlock version a newer kernel offers.
  # Beside it, whether a tracer without privileges sees a Landlock refusal on that runner.
  kvm:
    name: KVM and ptrace on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            qemu: qemu-system-x86
          - runner: ubuntu-24.04
            qemu: qemu-system-x86
          - runner: ubuntu-24.04-arm
            qemu: qemu-system-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU
        env:
          QEMU_PACKAGE: ${{ matrix.qemu }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends "${QEMU_PACKAGE}"

      - name: Survey
        run: bash tests/runner-capability-probe.sh --report

      - name: Assert that a guest boots under KVM
        id: kvm
        run: ./.github/scripts/record-capability.sh kvm --assert-kvm

      # The layer pruner runs on both architectures, so each runner image answers this too.
      - name: Assert that ptrace observes a Landlock denial
        id: ptrace
        if: ${{ !cancelled() }}
        run: ./.github/scripts/record-capability.sh ptrace --assert-ptrace

      - name: Write the verdict
        if: ${{ !cancelled() }}
        env:
          KVM_VERDICT: ${{ steps.kvm.outputs.verdict }}
          PTRACE_VERDICT: ${{ steps.ptrace.outputs.verdict }}
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          kvm="${KVM_VERDICT:-indeterminate}"
          ptrace="${PTRACE_VERDICT:-indeterminate}"
          {
            echo "## KVM and ptrace on ${RUNNER_LABEL}"
            echo
            echo "| Capability | Verdict | What depends on it |"
            echo "| --- | --- | --- |"
            echo "| A guest kernel boots under KVM | ${kvm} | a kernel newer than the runner's, for Landlock 10 |"
            echo "| ptrace observes a Landlock denial, plain container | ${ptrace} | the layer pruner's observer |"
            echo
            echo "Read the survey step for the access to /dev/kvm, the boot times and ptrace_scope."
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${kvm}" = "indeterminate" ] || [ "${ptrace}" = "indeterminate" ]; then
            echo "::error::A probe could not reach a verdict, so this run answers nothing."
            exit 1
          fi
