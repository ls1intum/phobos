# Runs the suites that need only a compiler, a shell, a Python and Bubblewrap, and no
# container, no kernel feature and no elevated permission. That is the whole point of this
# workflow: the checks that cost seconds run on every pull request, so the ones that need
# the run-phase image are built and argued about separately, in build.yml.
name: Test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: Shell suites
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Both prune images name run_minimal_fs_all.sh as their entry point, and it in turn
      # refuses to start unless detect_minimal_fs.sh is executable. A mode lost in a commit
      # therefore stops the prune phase before it runs a line, and nothing else here would
      # notice, because every suite invokes its script through `bash`.
      #
      # The layers under core/ are checked for the same reason. phobos.sh runs
      # phobos-policy.sh and every layer as a program rather than through `bash`, and the
      # README and CLAUDE.md tell a reader to call core/phobos.sh directly, so a mode lost
      # here ends a run with exit 126 outside the image, which sets the modes itself.
      # phobos-common.sh and phobos-constants.sh are absent on purpose: they are sourced,
      # never run, and a mode on them would suggest otherwise.
      - name: The entry points are executable
        run: |
          for script in var/tmp/pruning/run_minimal_fs_all.sh var/tmp/pruning/detect_minimal_fs.sh \
                        core/phobos.sh core/phobos-policy.sh core/phobos-filesystem.sh \
                        core/phobos-network.sh core/phobos-resources.sh core/phobos-timeout.sh; do
            if [ ! -x "${script}" ]; then
              echo "::error file=${script}::not executable, so it cannot be started as a program"
              exit 1
            fi
          done

      # What the suites here need beyond the runner's own image. Bubblewrap is what the
      # discovery phase measures with, so without it tests/prune_sandbox.sh skips exactly
      # the checks that exercise the pruner; gcc-14 is the compiler the C probes of the
      # network suites are pinned to, and without it those suites skip themselves whole;
      # haproxy is the egress broker tests/haproxy_broker.sh drives, and openssl is the client
      # that sends it a ClientHello with a host name; that suite skips without either.
      # A skip reads as a pass in the workflow's summary, so they are installed rather
      # than left to the image.
      - name: Install what the suites need
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends bubblewrap gcc-14 haproxy openssl

      # Each suite reports its own passed, failed and skipped counts and exits non-zero on
      # a failure, so they are separate steps: one run then names every suite that broke
      # rather than only the first.
      # First, because every suite below reports through it. A reporting helper that records
      # a failure wrongly does not announce itself, it makes a suite green.
      - name: The suites' own reporting
        if: ${{ !cancelled() }}
        run: bash tests/harness_self_test.sh

      - name: The timeout contract
        if: ${{ !cancelled() }}
        run: bash tests/timeout_units.sh

      - name: The timeout stops a command that ignores SIGTERM
        if: ${{ !cancelled() }}
        run: bash tests/timeout_escalation.sh

      - name: The timeout's group lock refuses setsid and setpgid
        if: ${{ !cancelled() }}
        run: bash tests/seccomp_timeoutsystem.sh

      - name: Each layer runs on its own from a config
        if: ${{ !cancelled() }}
        run: bash tests/standalone_layers.sh

      - name: The command-line contract
        if: ${{ !cancelled() }}
        run: bash tests/cli_flags.sh

      # How the network allow-list becomes Landlock TCP-port rules: a concrete port is
      # enforced, a loopback host with no port is tolerated, a non-loopback host with no
      # port is refused, and the mixed case is refused. No sandbox needed.
      - name: The network policy
        if: ${{ !cancelled() }}
        run: bash tests/network_policy.sh

      - name: The connect guard enforces the allow-list by host and port
        if: ${{ !cancelled() }}
        run: bash tests/seccomp_networksystem.sh

      - name: The allow-list becomes an egress-broker config
        if: ${{ !cancelled() }}
        run: bash tests/haproxy_conf.sh

      - name: The egress broker enforces the allow-list by TLS host name
        if: ${{ !cancelled() }}
        run: bash tests/haproxy_broker.sh

      # The [limits] resource keys are parsed and, when applied, set the process's rlimits,
      # the in-process line against a fork bomb, a runaway allocation or a disk-filling file.
      - name: The resource limits
        if: ${{ !cancelled() }}
        run: bash tests/resource_limits.sh

      # The filesystem layer's denial report, both directions, and that neither the report nor
      # the helpers behind it ever cost the command its output or its exit status.
      - name: The denial report
        if: ${{ !cancelled() }}
        run: bash tests/denial_report.sh

      - name: The timeout and resource-limit merge
        if: ${{ !cancelled() }}
        run: bash tests/limit_merge.sh

      - name: The policy program
        if: ${{ !cancelled() }}
        run: bash tests/policy_program.sh

      # The rights hierarchy decides which policies are refused before a command runs, and
      # nothing measured it until this suite: a nested entry narrower than its ancestor is
      # unenforceable and refused, while a redundant one and a merely different one are both
      # allowed, and the redundant one is what lets an exercise config name that path with
      # fewer rights.
      - name: The filesystem policy
        if: ${{ !cancelled() }}
        run: bash tests/filesystem_policy.sh

      # Stubs stand in for the pruner and the emitter, so this needs no bubblewrap and
      # no exercises. It covers the two ways the prune phase can quietly produce less
      # than it should: finishing successfully with artefacts missing, and leaving an
      # earlier run's artefacts in place.
      - name: What the prune phase produces
        if: ${{ !cancelled() }}
        run: bash tests/prune_producer.sh

      # The real pruner, against a fixture tree. How it classifies a build's outcome, the
      # NO-SOURCE rule among it, is checked through a bwrap that builds no sandbox, so those
      # checks run anywhere. The checks that need Bubblewrap itself are the ones that
      # exercise the discovery phase as it really measures, so PHOBOS_REQUIRE_BWRAP turns
      # their skip into a failure here: a runner that cannot build a sandbox is a broken
      # runner, not a reason to report a pass.
      - name: What the pruner concludes from a build
        if: ${{ !cancelled() }}
        env:
          PHOBOS_REQUIRE_BWRAP: "1"
        run: bash tests/prune_sandbox.sh

  python:
    name: Python helpers
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest
        run: python -m pip install --quiet pytest==8.4.2

      # These two helpers turn a pruning run into the allow-list a sandbox is then built
      # from, so a defect in either is a defect in a security policy.
      - name: Run the helper tests
        run: python -m pytest tests/python -q
