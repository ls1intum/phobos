# The unit tests: the suites that need no run-phase image, one job per part of the repository.
# The end-to-end suites, which run against the run-phase image, live in build.yml beside the job
# that builds it, together with the suites of their layer that run on the runner itself.
name: Test

# A change that touches nothing but the documentation site starts none of these jobs: no suite reads a
# file under documentation/, and documentation-ci.yml is that site's own gate. Lint keeps running on such
# a change, because yamllint and editorconfig-checker read documentation/ too.
on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "documentation/**"
  push:
    branches: [ "main" ]
    paths-ignore:
      - "documentation/**"
  # Weekly, so that a toolchain that stops compiling the sources under mutation testing, or a moved
  # apt package, is noticed without anyone touching the tree first.
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protecter:
    name: Protecter unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every suite invokes its script through `bash`, so a mode lost in a commit would go
      # unnoticed. phobos.sh runs phobos-policysystem.sh and every layer as a program rather
      # than through `bash`, and the README and CLAUDE.md tell a reader to call protecter/src/phobos.sh
      # directly, so a mode lost here ends a run with exit 126 outside the image, which sets
      # the modes itself.
      # phobos-common.sh and phobos-constants.sh are absent on purpose: they are sourced,
      # never run, and a mode on them would suggest otherwise.
      - name: The entry points are executable
        run: |
          for script in protecter/src/phobos.sh protecter/src/phobos-policysystem.sh \
                        protecter/src/phobos-filesystem.sh protecter/src/phobos-networksystem.sh \
                        protecter/src/phobos-resourcesystem.sh protecter/src/phobos-timeoutsystem.sh \
                        pruner/runtime_pruner/src/interface/phobos-record phobos-cli.sh; do
            if [ ! -x "${script}" ]; then
              echo "::error file=${script}::not executable, so it cannot be started as a program"
              exit 1
            fi
          done

      # A suite that no workflow starts passes nothing and fails nothing, and it reads like
      # coverage in the tree, so protecter/test/integration/haproxy_inbound.sh sat unrun for a long time.
      # Every shell file under protecter/test/ and pruner/ has to be named in a workflow, except the ones that are
      # not suites: the reporting helper and the matrix library that suites source, the
      # matrix's run-all.sh, which is for running them by hand, and the redundancy probe, a
      # diagnostic that takes arguments.
      - name: Every suite is started by a workflow
        run: |
          missing=0
          while IFS= read -r suite; do
            name="$(basename "${suite}")"
            case "${name}" in
              harness.sh | lib.sh | run-all.sh | policy-redundancy-probe.sh) continue ;;
            esac
            # A fixture's script is an exercise a suite runs, not a suite of its own.
            case "${suite}" in
              */*-fixture/*) continue ;;
            esac
            if ! grep -rqF -- "${name}" .github/workflows; then
              echo "::error file=${suite}::no workflow starts this suite, so it runs nowhere"
              missing=1
            fi
          done < <(find protecter/test pruner -name '*.sh' -type f | sort)
          exit "${missing}"

      # What the suites here need beyond the runner's own image. gcc-14 is the compiler the C unit
      # suites are pinned to, and haproxy is what protecter/test/unit/phobos-tools-networksystem/haproxy_conf.sh
      # holds the generated configuration to. A skip reads as a pass in the workflow's summary, so
      # they are installed rather than assumed.
      - name: Install what the suites need
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-14 haproxy openssl

      # Each suite reports its own passed, failed and skipped counts and exits non-zero on
      # a failure, so they are separate steps: one run then names every suite that broke
      # rather than only the first.
      # First, because every suite below reports through it. A reporting helper that records
      # a failure wrongly does not announce itself, it makes a suite green.
      - name: The suites' own reporting
        if: ${{ !cancelled() }}
        run: bash protecter/test/harness_self_test.sh

      # What every layer waits through: a signal sent to the layer reaches the command, the status is
      # the command's own, standard input stays the command's and the layer's own traps come back.
      - name: A layer passes a caller's signals on to its command
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-common/signals.sh

      - name: The timeout contract
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-common/timeout_units.sh

      # How the network allow-list becomes Landlock TCP-port rules: a concrete port is
      # enforced, a loopback host with no port is tolerated, a non-loopback host with no
      # port is refused, and a loopback wildcard beside a concrete port leaves the guard
      # to enforce it. No sandbox needed.
      - name: The network policy
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-networksystem/network_policy.sh

      # Which spellings of an address, a range and a port a [connect] line may use: each right one
      # is accepted and each almost-right one refused, since the guard would read it as a host name
      # and open its port to every address.
      - name: The spellings of an address in a connect rule
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/address_literals.sh

      # Which YAML an Ares 2 policy may be written in: every construct of the subset is read into
      # the exact records, and every construct two YAML readers could read differently is refused
      # with its line rather than read one way.
      - name: The YAML subset a policy may be written in
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/yaml_subset.sh

      # A programming language configuration is the one place a language enters Phobos: the loader
      # takes its two sections and three primitives and refuses everything else with file and line,
      # and no code under protecter/src/ outside protecter/src/config/ names a language
      # configuration or its placeholders.
      - name: The programming language configurations
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/language_configuration.sh

      - name: No programming language in the code
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/no_language_in_code.sh

      # The configurations the image ships, read by the real loader: each names exactly the base of
      # its build tool, the Maven base is never folded by a run without an Ares 2 policy, and it
      # grants no [execute] on a directory that can be written.
      - name: The shipped programming language configurations
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/shipped_language_configurations.sh

      # How an Ares 2 policy becomes the parsed state a .cfg gives: every field the import maps is
      # mapped as the documentation says, and every element whose translation would widen or narrow
      # the sandbox without saying so is refused with its line.
      - name: The Ares 2 policy import
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-policysystem/ares_policy.sh

      - name: The allow-list becomes an egress-broker config
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-networksystem/haproxy_conf.sh

      # The lines a run adds to a hosts file carry its tag and leave with its specification
      # directory, under a lock and in place. A scratch hosts file, so no root is needed.
      - name: A run's hosts-file lines are removed with it
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-tools-common/hosts_entries.sh

      # The C programs' own unit suites, with gcc-14 and nothing else. The syscalls are interposed
      # through the linker, so these need no Landlock, no container and no elevated permission.
      - name: The Landlock program's unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-landlock-filesystem-and-networksystem/run.sh

      - name: The connect guard's unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-networksystem/seccomp_networksystem_run.sh

      # The guard installs a real seccomp filter and forks only when run for real; the unit
      # suite wraps every syscall and fork instead, so it needs no kernel, and its interposed
      # calls are answered rather than passed through, so gcov's own writes are undisturbed.
      # Lines are held to 100 %; branches are reported, not gated, for the reason the script
      # states.
      - name: Every line of the connect guard ran
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-networksystem/seccomp_networksystem_run.sh --coverage

      # The denial reporter's sources are held to the same line gate as the guard, and its
      # quoting to bash's own over a corpus of names.
      - name: The denial reporter's unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-filesystem/seccomp_filesystem_run.sh

      - name: Every line of the denial reporter ran
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-seccomp-filesystem/seccomp_filesystem_run.sh --coverage

      # The Landlock program's suite has no coverage step, deliberately. It interposes open and
      # close, which is also how the gcov runtime writes its .gcda files, so an instrumented run has
      # gcov's own diagnostics landing on stderr. That breaks the test asserting that a run which
      # goes through says nothing. Mutation testing is the stronger measure of it: clang and mull
      # are installed into a container and the suite runs once per mutant, and a run that does not
      # reach a score fails, so a toolchain that stops compiling the sources is noticed in the pull
      # request that broke it.
      - name: Mutation score of the Landlock program's unit tests
        if: ${{ !cancelled() }}
        run: bash protecter/test/unit/phobos-landlock-filesystem-and-networksystem/mutation.sh

  exercise-pruner:
    name: Exercise-Pruner unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest
        run: python -m pip install --quiet pytest==8.4.2

      # The layer pruner and the orchestrator turn a pruning run into the allow-list a sandbox is
      # then built from, so a defect here is a defect in a security policy.
      - name: Run the unit tests
        run: python -m pytest pruner/exercise_pruner -q

  runtime-pruner:
    name: Runtime-Pruner unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest
        run: python -m pip install --quiet pytest==8.4.2

      # The recording pruner turns a recorded session into a policy, so a defect here is a defect
      # in a security policy too.
      - name: Run the unit tests
        run: python -m pytest pruner/runtime_pruner -q

  shared-pruner:
    name: Shared-Pruner unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest
        run: python -m pip install --quiet pytest==8.4.2

      # What both pruners rest on: the policy model, the strace parser, attribution, generalisation,
      # limits and the sampler, and the rule that says which layer may import which.
      - name: Run the unit tests
        run: python -m pytest pruner/shared -q
