# Phobos baseline policy, reference only.
#
# IMPORTANT: the policy format Phobos actually parses is the INI-like cfg read
# by core/phobos-common.sh (parse_cfg_policy), NOT this YAML. The shipped
# baselines are core/config/BaseLanguage-<lang>.cfg. Nothing loads this file;
# it documents the real format so a reader is not misled by an older schema.
format: "INI-like cfg parsed by core/phobos-common.sh:parse_cfg_policy"
shipped_baselines:
  - core/config/BaseLanguage-java.cfg
  - core/config/BaseLanguage-python.cfg
sections:
  read: "grants read on the whole subtree"
  execute: "grants execute; a program tree needs both [read] and [execute]"
  write: "grants write into an existing file (and truncate)"
  create: "grants creation of files, directories, sockets and named pipes; never a device node or a symbolic link"
  delete: "grants deletion of files and directories"
  connect: "allow <host>[:<port>] lines, outbound TCP; loopback may omit the port"
  bind: "allow <addr>:<port> or <port> lines; local TCP endpoints, address filtered by libnetblocker"
  limits: "timeout, mem_mb, nproc, nofile, fsize_mb, cpu; 0 switches one off"
# A real, runnable example of the format above, as a plain string.
example_cfg: |
  [read]
  /usr
  /opt/java/openjdk

  [execute]
  /usr
  /opt/java/openjdk

  [write]
  /tmp

  [create]
  /tmp

  [connect]
  allow 127.0.0.1:*
  allow [::1]

  [limits]
  timeout = 120
  mem_mb = 2048
