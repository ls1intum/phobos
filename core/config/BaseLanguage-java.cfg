[readonly]
/bin
# The JVM and its libraries seed randomness from /dev/urandom; without it startup stalls.
/dev/urandom
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk/bin
/opt/java/openjdk/conf
/opt/java/openjdk/conf/security
/opt/java/openjdk/lib
/opt/java/openjdk/lib/server
/usr
/usr/bin
/usr/lib
/var/tmp/testing-dir/assignment
/var/tmp/testing-dir/gradlew
/var/tmp/testing-dir/gradle
/var/tmp/testing-dir/build.gradle

[write]
# Build tools and the JVM write to /dev/null constantly; denying it breaks ordinary runs.
/dev/null
/root/.gradle
/var/tmp/testing-dir/build
/tmp

[network]
allow 127.0.0.1:*
allow ::1:*
localhost