# Faithful per-right translation: a former [readonly] path grants read+execute, a former
# [write] path grants read+write, plus create, delete, socket and named-pipe creation, and
# renaming or moving across directories. The last four were one blanket "make" plus an
# automatic REFER before those were split into their own rights, so a writable directory is
# now named in [restructure] (create+delete+refer) and [create-ipc] (sockets and named pipes)
# to hold exactly the rights it held before. /dev/null is a device node, on which every one of
# those rights is stripped, so it keeps only read and write.

[read]
/bin
/dev/urandom
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk/bin
/opt/java/openjdk/conf
/opt/java/openjdk/conf/security
/opt/java/openjdk/lib
/opt/java/openjdk/lib/server
/usr
/usr/bin
/usr/lib
/var/tmp/testing-dir
/var/tmp/testing-dir/assignment
/var/tmp/testing-dir/gradlew
/var/tmp/testing-dir/gradle
/var/tmp/testing-dir/build.gradle
/dev/null
/root/.gradle
/var/tmp/testing-dir/build
/tmp
# What a JVM reads at start-up and is refused otherwise: static or aggregate information about the
# machine, granted file by file because /proc, /sys and /dev are never granted whole. Each is
# read-only. /proc/meminfo and /proc/stat hold host-wide counters that move with other work on the
# host, a coarse side channel about other runs, and are granted because the JVM sizes its heap and
# its thread pools from them. The JVM's other refusals (a write of /proc/self/coredump_filter, the
# mount table and the interfaces under /proc, another process's /proc/<pid>/stat, /proc/self/fd and
# a write of /dev/tty) are per-run names or leak host paths, addresses or the operator's terminal,
# and stay refused and reported. A kernel without one of these files has nothing to grant.
/proc/cpuinfo
/proc/meminfo
/proc/stat
/proc/cgroups
/proc/filesystems
/proc/sys/vm/overcommit_memory
/sys/devices/system/cpu/possible
/sys/devices/system/cpu/online
/sys/kernel/mm/transparent_hugepage/enabled
/sys/kernel/mm/transparent_hugepage/hpage_pmd_size
/dev/random

[execute]
/bin
/dev/urandom
/etc
/lib
/lib/x86_64-linux-gnu
/lib64
/opt
/opt/java/openjdk/bin
/opt/java/openjdk/conf
/opt/java/openjdk/conf/security
/opt/java/openjdk/lib
/opt/java/openjdk/lib/server
/usr
/usr/bin
/usr/lib
/var/tmp/testing-dir
/var/tmp/testing-dir/assignment
/var/tmp/testing-dir/gradlew
/var/tmp/testing-dir/gradle
/var/tmp/testing-dir/build.gradle

[write]
/dev/null
/root/.gradle
/var/tmp/testing-dir/build
/tmp

[restructure]
/root/.gradle
/var/tmp/testing-dir/build
/tmp

[create-ipc]
/root/.gradle
/var/tmp/testing-dir/build
/tmp
[connect]
allow 127.0.0.1:*
allow [::1]
allow localhost

# Gradle and the workers it starts open server sockets on a port the kernel chooses, and a UDP
# socket for file locking. Port 0 grants exactly that and no fixed port, so a command still
# cannot listen on 8080 or any other number it picks.
[bind]
allow 0
allow 0 udp


