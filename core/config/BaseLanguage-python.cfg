# The Python base, derived by the layer pruner (var/tmp/helpers/layer_prune) from the Python reference
# exercise, var/tmp/testing-dir/python/python-reference, on the official Python image. Every row rests on
# a refusal that the grading layers recorded for that exercise, and no row is wider than the observation
# (the library directories are granted whole, as the pruner's compaction rule does outside a fine-grained
# root). A code path the reference never took is refused when graded; widen this file by pruning another
# reference, never by hand.
