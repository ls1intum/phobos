# Observed on two machines, and joined here: x86_64 (GitHub Actions run 37716084123 of prune-kvm.yml, key
# python, kernel 7.0.0-azure, Landlock ABI 8, verified on two ABI 10 guests with no row to add) and aarch64
# (a local run of the same pruner, Docker Desktop kernel 7.0.14, Landlock ABI 8). They differ only in the
# directory of the C library, so both are named; a base names a path that does not exist on the other
# machine, which phobos-policysystem.sh tolerates for a base and refuses for an exercise configuration.
