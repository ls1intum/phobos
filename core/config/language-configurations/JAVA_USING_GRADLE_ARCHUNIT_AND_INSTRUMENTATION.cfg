# The programming language configuration JAVA_USING_GRADLE_ARCHUNIT_AND_INSTRUMENTATION of Ares 2: the base
# policy a run that imports an Ares 2 policy naming it runs under, and how Phobos determines each
# placeholder such a policy may use in a path. This file is the one place a programming language
# enters Phobos; the code that reads it knows no language.
#
# The four Gradle configurations differ only in what Ares analyses and how it enforces inside the
# JVM, which grants nothing at the operating-system level, so all four name the same base, the
# Java base, which was pruned on a Gradle exercise.
[base]
BaseLanguage-java.cfg

# Each value is determined from the environment and the PATH of the process that runs phobos.sh,
# before the command exists, never from anything the submission can reach. java.home is the JDK
# the java on the PATH belongs to: that binary resolved through its symbolic links, two levels up
# (/opt/java/openjdk/bin/java gives /opt/java/openjdk). The JVM takes user.home from the password
# database entry of its real uid, not from HOME, and so does this; from JDK 19 it falls back to HOME
# when there is no entry or the home is shorter than two characters, and Phobos refuses exactly
# those cases rather than guess. On Linux the JVM's
# java.io.tmpdir is /tmp whatever TMPDIR says, so it is fixed here rather than read from TMPDIR,
# which would name a directory Ares does not mean.
[placeholders]
java.home      = command-ancestor java 2
user.home      = password-database home
java.io.tmpdir = fixed /tmp
