services:
  prune_python:
    build: docker/prune_phase/python
    volumes:
      - type: bind
        source: ./var/tmp
        target: /var/tmp
    command: ["--verbose", "--cache-dir", "/home/sandboxuser/.cache/pip", "python"]

  prune_java:
    build: docker/prune_phase/java
    volumes:
      - type: bind
        source: ./var/tmp
        target: /var/tmp
    command: ["--verbose", "--cache-dir", "/home/sandboxuser/.gradle", "java" ]

  # The recording pruner: records the instructor's reference program while a person uses it, with
  # no sandbox at all, and replays it under the layers with `check`. Started only on purpose, as
  #   RECORD_EXERCISE=<exercise directory> docker compose --profile record run --rm record record -- <command>
  # and each `run` is a new container, which is what a replay check needs. Offline; the networked
  # service is for a program that must reach hosts. Never point either at an untrusted submission.
  # No privilege, capability or security option: strace traces only the recorder's own children.
  # The image is built from the repository root, since its Dockerfile copies files by their
  # repository paths, on the run-phase image docker/run_phase/java/docker-compose.yaml builds. The
  # recordings are written as root under ./var/tmp/recordings, so removing one may need sudo; without
  # RECORD_EXERCISE an empty directory there stands in for the exercise.
  record: &record
    profiles: ["record"]
    image: phobos-prune-layers-record
    build:
      context: .
      dockerfile: docker/prune_phase/layers/Dockerfile
      args:
        RUN_PHASE_IMAGE: ${RUN_PHASE_IMAGE:-phobos-run-phase-java}
    entrypoint: ["/var/tmp/helpers/layer_record/phobos-record"]
    stdin_open: true
    tty: true
    network_mode: none
    volumes:
      - ./var/tmp/helpers:/var/tmp/helpers:ro
      - ${RECORD_EXERCISE:-./var/tmp/recordings/.no-exercise}:/srv/phobos-record-exercise:ro
      - ./var/tmp/recordings:/var/tmp/recordings

  record_networked:
    <<: *record
    network_mode: bridge

  orchestrate:
    build: docker/prune_phase/orchestrate
    volumes:
      - type: bind
        source: ./var/tmp
        target: /var/tmp
    depends_on:
      prune_python:
        condition: service_completed_successfully
      prune_java:
        condition: service_completed_successfully
    command:
      [
        "--langs", "python,java",
        "--path-dir", "/var/tmp/path_sets", "--skip-prune"
      ]
