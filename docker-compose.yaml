# What every service of the layer pruner shares. The network is set per service: none for the prune
# and its verification, and the project's own network for the opt-in egress service only. Each
# language's prune image is built on that language's run-phase image, so an exercise is pruned in
# the image it is graded in: docker/protecter/<language>/docker-compose.yaml builds it.
x-prune-layers: &prune_layers
  build:
    context: .
    dockerfile: docker/pruner/layers/Dockerfile
    args:
      RUN_PHASE_IMAGE: ${RUN_PHASE_IMAGE:-phobos-run-phase-java}
  image: phobos-prune-layers
  entrypoint: ["python3", "/var/tmp/helpers/exercise_pruner/src/interface/main.py"]
  mem_limit: 3g
  pids_limit: 1024
  volumes:
    - ./exercises:/srv/phobos-prune-exercises:ro
    - ./pruner:/var/tmp/helpers:ro
    - ./build/pruner/path_sets:/var/tmp/path_sets

# The same, built on the Python run-phase image.
x-prune-layers-python: &prune_layers_python
  <<: *prune_layers
  build:
    context: .
    dockerfile: docker/pruner/layers/Dockerfile
    args:
      RUN_PHASE_IMAGE: ${RUN_PHASE_IMAGE_PYTHON:-phobos-run-phase-python}
  image: phobos-prune-layers-python

# The same, built on the run-phase image of the FACT template.
x-prune-layers-c-fact: &prune_layers_c_fact
  <<: *prune_layers
  build:
    context: .
    dockerfile: docker/pruner/layers/Dockerfile
    args:
      RUN_PHASE_IMAGE: ${RUN_PHASE_IMAGE_C_FACT:-phobos-run-phase-c-fact}
  image: phobos-prune-layers-c-fact

# What the verification of the merged base mounts besides: the orchestrator's output, read-only.
x-verify-volumes: &verify_volumes
  - ./exercises:/srv/phobos-prune-exercises:ro
  - ./pruner:/var/tmp/helpers:ro
  - ./build/pruner/path_sets:/var/tmp/path_sets
  - ./build/pruner/config:/srv/phobos-merged:ro

services:
  # Every language is pruned on the grading layers themselves (docker/pruner/layers, README
  # "The layer pruner"). The exercises are mounted read-only and only the artefacts' directory is
  # writable, since every run replaces /var/tmp/testing-dir with a fresh copy of the exercise
  # (A.6.1). No network, no privilege and no capability: strace traces only the pruner's own
  # children.
  prune_java_gradle:
    <<: *prune_layers
    network_mode: none
    command: ["--stage", "all", "java-gradle"]

  # The recording pruner: records the instructor's reference program while a person uses it, with
  # no sandbox at all, and replays it under the layers with `check`. Started only on purpose, as
  #   RECORD_EXERCISE=<exercise directory> docker compose --profile record run --rm record record -- <command>
  # and each `run` is a new container, which is what a replay check needs. Offline; the networked
  # service is for a program that must reach hosts. Never point either at an untrusted submission.
  # No privilege, capability or security option: strace traces only the recorder's own children.
  # The image is built from the repository root, since its Dockerfile copies files by their
  # repository paths, on the run-phase image docker/protecter/java/docker-compose.yaml builds. The
  # recordings are written as root under ./build/pruner/recordings, so removing one may need sudo; without
  # RECORD_EXERCISE an empty directory there stands in for the exercise.
  record: &record
    profiles: ["record"]
    image: phobos-prune-layers-record
    build:
      context: .
      dockerfile: docker/pruner/layers/Dockerfile
      args:
        RUN_PHASE_IMAGE: ${RUN_PHASE_IMAGE:-phobos-run-phase-java}
    entrypoint: ["/var/tmp/helpers/runtime_pruner/src/interface/phobos-record"]
    stdin_open: true
    tty: true
    network_mode: none
    volumes:
      - ./pruner:/var/tmp/helpers:ro
      - ${RECORD_EXERCISE:-./build/pruner/recordings/.no-exercise}:/srv/phobos-record-exercise:ro
      - ./build/pruner/recordings:/var/tmp/recordings

  record_networked:
    <<: *record
    network_mode: bridge

  # The Maven reference exercise (exercises/java/maven-reference) is pruned under its own key, java-maven, in the
  # same image as Gradle's, with the same mounts and no network, no privilege and no capability, and the
  # manifest of the pre-loaded repository mounted read-only: the exercise's prune.json declares that
  # repository as a pinned read root, and the pruner checks it against this file before any run
  # (README "The Maven prune").
  prune_java_maven:
    <<: *prune_layers
    network_mode: none
    # The base's three mounts again, since a merge replaces a list instead of extending it.
    volumes:
      - ./exercises:/srv/phobos-prune-exercises:ro
      - ./pruner:/var/tmp/helpers:ro
      - ./build/pruner/path_sets:/var/tmp/path_sets
      - ./protecter/image/maven-repository.sha256:/srv/phobos-manifest/maven-repository.sha256:ro
    command: ["--stage", "all", "java-maven"]

  prune_python:
    <<: *prune_layers_python
    network_mode: none
    command: ["--stage", "all", "python"]

  prune_c_fact:
    <<: *prune_layers_c_fact
    network_mode: none
    command: ["--stage", "all", "c-fact"]

  # Opt-in, for the Java exercises under exercises/java-egress whose prune.json declares
  # hosts (A.6.5): unlike the other layer-pruner services it has a network, and it keeps or drops
  # declared rules but never adds one. The project's own network gives the container Docker's
  # resolver at 127.0.0.11, which the egress broker resolves the declared names through. Its
  # artefacts go to path_sets/egress, which the orchestrator does not merge; adopting a declared rule
  # is a reviewed step of its own. Run it with
  #   docker compose --profile egress run --rm prune_java_egress
  prune_java_egress:
    <<: *prune_layers
    profiles: ["egress"]
    command: ["--resolver", "127.0.0.11", "--output-dir", "/var/tmp/path_sets/egress", "java-egress"]

  orchestrate:
    build:
      context: .
      dockerfile: docker/pruner/orchestrate/Dockerfile
    volumes:
      - ./pruner:/var/tmp/helpers:ro
      - ./build/pruner/path_sets:/var/tmp/path_sets
      - ./build/pruner/config:/var/tmp/opt/core/config
    depends_on:
      prune_python:
        condition: service_completed_successfully
      prune_java_gradle:
        condition: service_completed_successfully
      prune_java_maven:
        condition: service_completed_successfully
      prune_c_fact:
        condition: service_completed_successfully
    command: ["--langs", "python,java-gradle,java-maven,c-fact", "--path-dir", "/var/tmp/path_sets"]

  # Run every exercise once more under what grading will apply: the merged BaseLanguage-<language>.cfg
  # and the exercise's own file under exercises/, as the orchestrator wrote them. Their records go to
  # path_sets/verify/; they change no artefact of the prune.
  verify_java_gradle:
    <<: *prune_layers
    network_mode: none
    volumes: *verify_volumes
    depends_on:
      orchestrate:
        condition: service_completed_successfully
    command: ["--verify", "/srv/phobos-merged", "java-gradle"]

  # The same for the Maven reference exercise, under the merged BaseLanguage-java-maven.cfg.
  verify_java_maven:
    <<: *prune_layers
    network_mode: none
    volumes: *verify_volumes
    depends_on:
      orchestrate:
        condition: service_completed_successfully
    command: ["--verify", "/srv/phobos-merged", "java-maven"]

  verify_python:
    <<: *prune_layers_python
    network_mode: none
    volumes: *verify_volumes
    depends_on:
      orchestrate:
        condition: service_completed_successfully
    command: ["--verify", "/srv/phobos-merged", "python"]

  verify_c_fact:
    <<: *prune_layers_c_fact
    network_mode: none
    volumes: *verify_volumes
    depends_on:
      orchestrate:
        condition: service_completed_successfully
    command: ["--verify", "/srv/phobos-merged", "c-fact"]
