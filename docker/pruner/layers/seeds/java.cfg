# The Java seed: what a Java build needs that no refusal can show. Its scratch files have random names in
# /tmp (Ares writes /tmp/EssentialPackages_<random>.yaml, Surefire /tmp/surefire-root/...), which the pruner
# never grants from a refusal. The shipped BaseLanguage-java.cfg grants /tmp read, write, create and delete
# already. A row the build does not need is dropped by the minimisation.
[read]
/tmp

[write]
/tmp

[create]
/tmp

[delete]
/tmp
