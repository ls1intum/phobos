---
engineStrict: true

preferFrozenLockfile: true
autoInstallPeers: true

# Dependency overrides. pnpm reads overrides from this file in preference to `pnpm.overrides`
# in package.json. These lift transitive dependencies of the Docusaurus build toolchain past
# published advisories; the same versions are in use in the Ares 2 documentation site on the
# identical Docusaurus 3.10.2 stack.
overrides:
  # GHSA-5c6j-r48x-rmvq (remote code execution through RegExp.flags) and
  # GHSA-qj8w-gfj5-8c6v (processor exhaustion).
  serialize-javascript: '7.1.1'
  # GHSA-w5hq-g745-h8pq
  uuid: '14.0.2'

# Build scripts are blocked by default in pnpm 11 and later as a supply-chain safeguard. These
# three are native or code-generating steps the Docusaurus build needs: @swc/core and esbuild
# back the `@docusaurus/faster` bundler, and core-js compiles its polyfill entry points.
allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
