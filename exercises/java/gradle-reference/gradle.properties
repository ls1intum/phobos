# Gradle runs in the JVM it was started in, so that the build starts no daemon and no single-use daemon
# fork, whose setsid the timeout's group lock refuses. The first three lines state what the build requests;
# the same heap is the one DEFAULT_JVM_OPTS in gradlew gives the launching JVM, so the two agree and
# Gradle has no reason to fork. org.gradle.internal.instrumentation.agent is an internal property of
# Gradle, which a later Gradle may rename: a Gradle change is measured again where it is made.
org.gradle.daemon=false
org.gradle.jvmargs=-Xms64m -Xmx512m -Dfile.encoding=UTF-8
org.gradle.internal.instrumentation.agent=false
