# UNUSED / SAMPLE: this is an example in the libnetblocker rules format
# (host<space>port, '*' meaning every port), but nothing loads it. At run time
# libnetblocker reads NETBLOCKER_CONF, which phobos-network.sh sets to the
# generated net.rules under the run's spec directory, not this file.
*.gradle.org 443
repo.maven.apache.org 443
www.github.com 443
*.githubusercontent.com 443
127.0.0.1 *
www.google.com 443
