# The FACT base, derived by the layer pruner (pruner/exercise_pruner) from the FACT reference exercise,
# exercises/c/fact-reference, on the Debian image of docker/protecter/c-fact. Every row rests on a refusal that
# the grading layers recorded for that exercise, and no row is wider than the observation (the library
# directories are granted whole, as the pruner's compaction rule does outside a fine-grained root). A code path
# the reference never took is refused when graded; widen this file by pruning another reference, never by hand.
#
# The exercise declares runs_compiled_programs: FACT compiles the student's program and then runs it, so the
# working directory keeps [execute] beside its write. That is the one widening this base has over the others: a
# submission can run any file it writes into /var/tmp/testing-dir/assignment.
#
# Observed on one machine, aarch64 (a local run of the same pruner, Docker Desktop kernel 7.0.14, Landlock ABI 8).
# The directories whose names carry the machine, /usr/lib/<machine>-linux-gnu and /usr/libexec/gcc/<machine>-linux-gnu,
# are named for x86_64 as well, by their Debian multiarch names; no x86_64 prune has seen them yet, so run
# prune-kvm.yml for the key c-fact to observe them. A base names a path that does not exist on the other machine,
# which phobos-policysystem.sh tolerates for a base and refuses for an exercise configuration.
[read]
/opt/python
/tmp
/usr/bin
/usr/include
/usr/lib
/usr/libexec/gcc/aarch64-linux-gnu/14
/usr/libexec/gcc/x86_64-linux-gnu/14
/var/tmp/testing-dir

[execute]
/usr/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu
/usr/libexec/gcc/aarch64-linux-gnu/14
/usr/libexec/gcc/x86_64-linux-gnu/14
/var/tmp/testing-dir/assignment

[write]
/tmp
/var/tmp/testing-dir

[create]
/tmp
/var/tmp/testing-dir
