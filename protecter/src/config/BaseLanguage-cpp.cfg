# The C++ base, derived by the layer pruner (pruner/exercise_pruner) from the C++ reference exercise,
# exercises/cpp/cpp-reference, on the Debian image of docker/protecter/cpp. Every row rests on a refusal that the
# grading layers recorded for that exercise, and no row is wider than the observation (the library directories are
# granted whole, as the pruner's compaction rule does outside a fine-grained root). A code path the reference never
# took is refused when graded; widen this file by pruning another reference, never by hand.
#
# Three widenings come from the exercise's declarations. It declares runs_compiled_programs with
# compiled_programs_directory test: CMake builds the student's program and the Catch2 tests into the tests directory
# and the tester then runs them, so /var/tmp/testing-dir/test keeps [execute] beside its write, and a submission can
# run any file it writes into that directory and into no other. It declares uses_pseudo_terminals: the tester
# starts the program on a pseudo-terminal, so /dev/pts is read, written and open to ioctl. That grants every
# pseudo-terminal of the container's own devpts instance, to every exercise graded with this base. The sanitizer
# runtime reads /proc/self files (maps, cmdline, environ), which the pruner can only name per run, so /proc is read
# whole. The tests directory is written whole, and it holds the tester, so code the build runs can change the tester's
# files; the base keeps a submission inside the working directory and does not protect the grading inside it. The
# limits are not part of a base: this exercise's own file sets mem_mb=0, because the sanitizers the tester
# builds with reserve terabytes of address space, and a grading configuration for a C++ exercise must do the same.
#
# Observed on one machine, aarch64 (a local run of the same pruner, Docker Desktop kernel 7.0.14, Landlock ABI 8).
# The directories whose names carry the machine are named for x86_64 as well, by their Debian multiarch names; no
# x86_64 prune has seen them yet, so run prune-kvm.yml for the key cpp to observe them. A base names a path that
# does not exist on the other machine, which phobos-policysystem.sh tolerates for a base and refuses for an
# exercise configuration.
#
[read]
/dev/null
/dev/pts
/proc
/tmp
/usr/bin
/usr/include
/usr/lib
/usr/libexec/gcc/aarch64-linux-gnu/14
/usr/libexec/gcc/x86_64-linux-gnu/14
/usr/share/cmake-3.31/Modules
/var/tmp/testing-dir

[execute]
/usr/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu
/usr/libexec/gcc/aarch64-linux-gnu/14
/usr/libexec/gcc/x86_64-linux-gnu/14
/var/tmp/testing-dir/test

[write]
/dev/pts
/tmp
/var/tmp/testing-dir/test

[create]
/tmp
/var/tmp/testing-dir/test

[delete]
/tmp
/var/tmp/testing-dir/test

[ioctl]
/dev/pts
