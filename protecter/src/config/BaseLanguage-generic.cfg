# The generic base, derived by the layer pruner (pruner/exercise_pruner) from the shell reference exercise,
# exercises/generic/shell-reference, on the generic image of docker/protecter/generic, for an exercise in none of the
# languages the other images serve. Its tests use each tool the image carries for exercises: bash, coreutils,
# findutils, grep, sed, gawk, diffutils and make. Every row rests on a refusal that the grading layers recorded for
# that exercise, except the rows on /tmp, which come from the seed pruner/config/seeds/generic.cfg because mktemp
# names its files at random, and all four of which the minimisation kept. These rows grant their rights on the paths
# they name, beneath a named directory also on programs and files the reference never used, and an exercise's own
# configuration may grant more. Widen this file by pruning another reference, never by hand.
#
# The pruner grants a program's directory rather than the program, so /usr/bin is granted whole: every program
# installed there may run, gcc's driver, the assembler, the linker and openssl included. None of gcc's internals
# (/usr/libexec/gcc, /usr/lib/gcc) nor the C headers is granted, so a C compilation is refused at cc1.
#
# Observed on two machines and joined: on aarch64 by a local run of the same pruner (Docker Desktop kernel 7.0.14,
# Landlock ABI 8), and on x86_64 by the default prune of prune-kvm.yml run 38396541572, whose two KVM guests recorded
# no ABI 10 row. The two derived bases differ only in the multiarch library directory; this file is their union,
# made with the orchestrator's union_policy, which found no execute conflict. phobos-policysystem.sh tolerates a base
# path the machine lacks.
[read]
/tmp
/usr/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu
/var/tmp/testing-dir

[execute]
/usr/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu

[write]
/tmp
/var/tmp/testing-dir

[create]
/tmp
/var/tmp/testing-dir

[delete]
/tmp
