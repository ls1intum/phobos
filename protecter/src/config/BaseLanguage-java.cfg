# What a JVM reads at start-up and is refused otherwise: static or aggregate information about the
# machine, granted file by file because /proc, /sys and /dev are never granted whole. Each is
# read-only. /proc/meminfo and /proc/stat hold host-wide counters that move with other work on the
# host, a coarse side channel about other runs, and are granted because the JVM sizes its heap and
# its thread pools from them (decision of the denial reporting pull request, not a pruner result). The
# JVM's other refusals (a write of /proc/self/coredump_filter, the mount table and the interfaces under
# /proc, another process's /proc/<pid>/stat, /proc/self/fd and a write of /dev/tty) are per-run names or
# leak host paths, addresses or the operator's terminal, and stay refused and reported. A kernel without
# one of these files has nothing to grant.
/proc/cpuinfo
/proc/meminfo
/proc/stat
/proc/cgroups
/proc/filesystems
/proc/sys/vm/overcommit_memory
/sys/devices/system/cpu/possible
/sys/devices/system/cpu/online
/sys/kernel/mm/transparent_hugepage/enabled
/sys/kernel/mm/transparent_hugepage/hpage_pmd_size
/dev/random
# The kernel's random source, which SecureRandom and UUID.randomUUID read. The reference exercise never draws
# on it, so the pruner did not grant it; the previous base did, and an exercise that needs a random number
# must not fail for want of it. A read-only device file with no side channel.
/dev/urandom

