# The R base, derived by the layer pruner (pruner/exercise_pruner) from the R reference exercise,
# exercises/r/r-reference, on the Debian image of docker/protecter/r. Every row rests on a refusal that the grading
# layers recorded for that exercise, except the rows on /tmp, which the seed pruner/config/seeds/r.cfg grants
# because R names its temporaries at random, but the pruner may generalise read and execute grants to directories
# and widen rows further through compaction. These rows grant their rights on the paths they name, beneath a named
# directory also on programs and files the reference never used, and an exercise's own configuration may grant more.
# Widen this file by pruning another reference, never by hand.
#
# The exercise installs its packages into a library under the working directory (R_LIBS_USER), so the write rows
# are the working directory and /tmp, and nothing under /usr is writable. No file the run writes can be executed.
#
# Observed on one machine, aarch64 (a local run of the same pruner, Docker Desktop kernel 7.0.14, Landlock ABI 8).
# The directory of the C library, /usr/lib/<machine>-linux-gnu, is named for x86_64 as well, by its Debian multiarch
# name; no x86_64 prune has seen it yet, so run prune-kvm.yml for the key r to observe it. A base names a path that
# does not exist on the other machine, which phobos-policysystem.sh tolerates for a base and refuses for an
# exercise configuration.
[read]
/dev/null
/etc/R/Makeconf
/etc/R/Renviron
/etc/R/repositories
/tmp
/usr/bin
/usr/lib
/usr/share/R/share/R
/usr/share/R/share/Rd/macros
/var/tmp/testing-dir

[execute]
/usr/bin
/usr/lib/R/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu

[write]
/tmp
/var/tmp/testing-dir

[create]
/tmp

[restructure]
/var/tmp/testing-dir
