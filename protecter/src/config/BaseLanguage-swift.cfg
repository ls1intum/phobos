# The Swift base, derived by the layer pruner (pruner/exercise_pruner) from the Swift reference exercise,
# exercises/swift/swift-reference, on the Ubuntu image of docker/protecter/swift. Every row rests on a refusal that the
# grading layers recorded for that exercise, and no row is wider than the observation (the library directories are
# granted whole, as the pruner's compaction rule does outside a fine-grained root). A code path the reference never
# took is refused when graded; widen this file by pruning another reference, never by hand.
#
# The exercise declares runs_compiled_programs: SwiftPM compiles the package manifest into a program and runs it, and
# the build runs the test bundle's tools, all inside the solution's directory (TMPDIR is set there). The base therefore
# keeps [execute] on /var/tmp/testing-dir/assignment beside its write, as the FACT base does; a submission can run any
# file it writes into that directory and into no other. /proc is read whole: the toolchain reads many
# entries there (one per process it starts), and the pruner's compaction joined them into the directory. That is wider than
# the Java bases, which name single /proc files; the pull request that added this base says so.
#
# Observed on one machine, aarch64 (a local run of the same pruner, Docker Desktop kernel 7.0.14, Landlock ABI 8).
# The directory of the C library, /usr/lib/<machine>-linux-gnu, is named for x86_64 as well, by its Ubuntu multiarch
# name; no x86_64 prune has seen it yet, so run prune-kvm.yml for the key swift to observe it. A base names a path that
# does not exist on the other machine, which phobos-policysystem.sh tolerates for a base and refuses for an exercise
# configuration. /usr/lib64 is read for the same reason and was added after the first x86_64 run: the gold linker
# that clang uses there lists the directory and fails the link when it is refused.
[read]
/dev/null
/opt/swift-deps
/proc
/usr/bin
/usr/include
/usr/lib
/usr/lib64
/usr/share/pm
/usr/share/swift
/var/tmp/testing-dir

[execute]
/usr/bin
/usr/lib/aarch64-linux-gnu
/usr/lib/x86_64-linux-gnu
/var/tmp/testing-dir/assignment

[write]
/dev/null
/var/tmp/testing-dir

[create]
/var/tmp/testing-dir

[restructure]
/var/tmp/testing-dir/assignment
