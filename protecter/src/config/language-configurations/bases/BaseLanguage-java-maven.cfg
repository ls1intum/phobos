# The Java base for a Maven build, pruned on the grading layers from the Maven reference exercise
# (exercises/java-maven/maven-reference, Artemis's Maven test template with Ares 2): every grant
# below rests on a refusal the layers recorded, except the four /tmp rows, which come from the Java seed
# (docker/prune_phase/layers/seeds/java.cfg) because their file names are random.
#
# Origin: the Maven prune of pull request 193 (workflow prune-maven.yml, run 37614807773 on 1281bd9), on the
# image ls1tum/artemis-maven-template:java25-1@sha256:b8393cc0fd728e1645e63380e8470443a691cedf5aaa7b1b86fd33250141de3b,
# with the dependency repository /root/.m2/repository fixed by docker/run_phase/java/maven-repository.sha256
# (SHA-256 29cfddf096d30b3dfe8f523016d3b62f9e92b919a3caaecfc580f2c533fbd9bc), which the image build and the
# pruner both checked. The amd64 and arm64 runs differ only in the multiarch library directory, so this file
# names both, and a path an architecture lacks is skipped as a shipped base's paths are.
#
# Not edited by hand: a grant that looks wrong goes back to the prune. Only files under language-configurations/
# name it, so a run without an Ares 2 policy never folds it.

