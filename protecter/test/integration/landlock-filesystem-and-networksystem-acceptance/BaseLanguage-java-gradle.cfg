# Test policy: deliberately tight. Everything not listed here must be denied.
# Note: Landlock grants access to a whole subtree, so anything that must stay
# denied has to live OUTSIDE an allowed tree. /var/tmp/secret does.
# One section per right: a tree to be read and run from is named in [read] and
# [execute], a tree to be changed in [read], [write], [create] and [delete].
[read]
/opt/java
/usr
/etc
/var/tmp/opt/core
/var/tmp/testing-dir
/tmp
/var/tmp/testing-dir/allowed-rw

[execute]
/opt/java
/usr
/etc
/var/tmp/opt/core
/var/tmp/testing-dir

[write]
/tmp
/var/tmp/testing-dir/allowed-rw

[create]
/tmp
/var/tmp/testing-dir/allowed-rw

[delete]
/tmp
/var/tmp/testing-dir/allowed-rw

# Only the "good" loopback port is reachable; 18081 must stay blocked.
[connect]
allow 127.0.0.1:18080

# No base timeout: the effective timeout is the largest any cfg names, so a base value would
# raise, never lower, an exercise's deadline. The spin probe sets its own short deadline.
