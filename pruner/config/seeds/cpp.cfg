# The C++ seed: what a C++ build is known to need that no refusal can show. g++ and cmake write their temporaries under
# random names in /tmp (cc<random>.s, .o, .res, .ltrans), which the pruner never grants from a refusal. A row
# the build does not need is dropped by the minimisation.
[read]
/tmp

[write]
/tmp

[create]
/tmp

[delete]
/tmp
