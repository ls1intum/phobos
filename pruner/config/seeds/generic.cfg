# The seed of the generic reference exercise. mktemp writes names that change from run to run, which the
# pruner never grants from a refusal, so the first policy starts with /tmp. The minimisation drops any of
# these rows the build does not need, and the policy's comment names the rows that stayed.
[read]
/tmp

[write]
/tmp

[create]
/tmp

[delete]
/tmp
