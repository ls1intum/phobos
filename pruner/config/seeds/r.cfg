# The R seed: what an R build is known to need that no refusal can show. R CMD build, R CMD INSTALL and Rscript
# write their temporaries under random names in /tmp (Rtmp<random>, file<random>), which the pruner never grants
# from a refusal. A row the build does not need is dropped by the minimisation.
[read]
/tmp

[write]
/tmp

[create]
/tmp

[delete]
/tmp
