# The Swift kept seed: rows a Swift build needs although the prune runner does not show it, which no minimisation
# removes (pruner/exercise_pruner/src/domain/seed.py). Every row here is granted whether or not a prune run needs it,
# so each one says why it is here.
#
# /dev/urandom: Foundation 6.2 reads the bytes of every UUID() from it without checking that the open succeeded
# (swift-foundation release/6.2, Sources/_FoundationCShims/uuid.c, read_random), so without it every UUID is
# 00000000-0000-4000-8000-000000000000. SwiftPM's repository queue (Sources/Basics/Concurrency/ConcurrencyHelpers.swift,
# AsyncOperationQueue) tells its operations apart by UUID, and its width is max(1, 3 * CPUs / 4), so 1 where Swift sees
# 2 CPUs or fewer. When more operations overlap than that width, a waiting fetch is lost and the build hangs
# ("waitIfNeeded() leaked its continuation"). The reference hung that way in the KVM guest with 2 CPUs and passed with 4;
# on the 4-CPU prune runner it passes without the row, so a minimisation would remove it. swift-foundation commit
# fea8fa64009bc29abae50a8020385cbff4be3bcc replaced the unchecked read upstream; once the image's Swift has it, this
# row can go. Read only.
[read]
/dev/urandom
