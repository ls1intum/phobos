# The Swift seed: what a Swift build is known to need that no refusal can show. swift-build, swiftc and the XCTest runner
# write their temporaries under random names in /tmp (TemporaryDirectory.<random>, swift-<random>), which the pruner never grants
# from a refusal. A row the build does not need is dropped by the minimisation.
[read]
/tmp

[write]
/tmp

[create]
/tmp

[delete]
/tmp
