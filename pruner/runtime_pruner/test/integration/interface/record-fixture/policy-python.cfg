# Written by hand for record_replay.sh, standing in for a generated policy: it grants what an
# interactive python3 -q needs to start, read its standard library and keep its history in /root,
# and nothing else under /var or /srv.
[read]
/usr
/etc
/root
/var/tmp/testing-dir

[execute]
/usr

[write]
/dev/null
/root

[create]
/root
