# Written by hand for record_replay.sh, standing in for a generated policy: it grants what the
# fixture session needs (a shell and cat reading input.txt and writing out.txt in the working
# directory) and nothing under /var/tmp beyond that directory.
[read]
/usr
/etc
/var/tmp/testing-dir

[execute]
/usr

[write]
/dev/null
/var/tmp/testing-dir

[create]
/var/tmp/testing-dir
