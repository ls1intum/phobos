# NOTE: this is NOT an allow-list. It permits every destination and blocks a
# single domain (services.gradle.org). It is therefore not a containment
# boundary on its own. It is also not wired into the run phase: no run-phase or
# prune-phase code starts this proxy, and the enforced network boundary is the
# [network] section turned into Landlock TCP ports plus a --network none
# container, with libnetblocker as defence in depth. Kept as an example only.

# Don't write a PID file (avoids permission issues in containers)
pid_filename none

# 1) Define the blocked domain
acl block_gradle dstdomain services.gradle.org

# 2) Deny any request (HTTP or CONNECT) to that domain
http_access deny block_gradle

# 3) Allow everything else (deny-one, allow-all; see the note at the top)
http_access allow all

# 4) Proxy listen port
http_port 127.0.0.1:3128

# 5) Hostname (no functional impact)
visible_hostname minimal-proxy
